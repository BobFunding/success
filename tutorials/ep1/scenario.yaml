# 1편(관장님 회원가입) 장면 표 — 1편 재현 검사의 기준. 값을 바꾸면 재현 검사가 깨집니다.
# 원래 코드: record_ep1.py(녹화), build_ep1.py(편집), lines.py(대본)
제목: 관장님 회원가입, [3단계]면 끝!      # [ ] 안은 제목 강조색
파일이름: 태권월드_1편_관장님회원가입
주소: https://taekwonworld.net/
브랜드: taekwonworld
시작상태: 로그아웃
단계이름: [가입 화면 찾기, 정보 입력하기, 약관 동의하고 등록]
다음편: "2편: 로그인하기"
개인정보칸:              # 녹화할 때부터 글자를 흐리게
  - input[name=last_name]
  - input[name=first_name]
  - input[name=phone_number]
  - input[name=number_by_user]
  - input[name=dob]
  - input[name=sex_code]
요청차단: /account/sign/kwanjang   # 가입 양식 화면에서는 저장·발송 요청을 막음 (문자 발송·계정 생성 방지)

인트로:
  - {키: I1, 말: "안녕하세요, 태권 월드입니다.", 속도: 2, 높낮이: 3}
  - {키: I2, 말: "오늘은 관장님 회원가입 방법을, 세 단계로 알려 드릴게요.", 속도: 0, 높낮이: 1}
아웃트로:
  - {키: O1, 말: "오늘 배운 세 단계, 기억하시죠?", 속도: 1, 높낮이: 2}
  - {키: O2, 말: "다음 영상에서는 로그인 방법을 알려 드릴게요. 태권 월드였습니다.", 속도: 0, 높낮이: 1}

장면:
  # ── 1단계: 가입 화면 찾기 ──
  - 키: S1
    단계: 1
    말: "먼저, 첫 화면 오른쪽에 있는, 로그인 관장 버튼을 눌러 주세요."
    속도: -1
    동작: 클릭
    대상: 로그인(관장)
    누를곳: "button:has-text('로그인(관장)')"
    다음주소: "**/account/login"
  - 키: S2
    단계: 1
    말: "로그인 화면이 나오면, 아래쪽의 회원가입 버튼을 누릅니다."
    속도: 1
    높낮이: -1
    동작: 클릭
    대상: 회원가입
    누를곳: "button:has-text('회원가입')"
    다음주소: "**/account/sign"
  - 키: S3
    단계: 1
    말: "회원 유형이 네 가지 나오는데요, 관장님을 눌러 주세요."
    높낮이: 1
    동작: 클릭
    대상: 관장님
    누를곳: 'text="관장님"'
    먼저기다림비율: 0.45
    이동: 0.8
    커서보정: [0, 60]
    강조: {대상: "h1:has-text('관장님') >> xpath=ancestor::div[2]", 여백: 6, 시작: 이동}
    다음주소: "**/account/sign/kwanjang"
    기다릴것: "input[name=username]"

  # ── 2단계: 정보 입력하기 ──
  - 키: F1
    단계: 2
    말: "이제 위에서부터 차례로 채워 볼게요."
    높낮이: 1
    동작: 스크롤
    스크롤: [{위치: 650, 시간: 1.4}, {대기: 0.2}, {위치: 0, 시간: 1.1}]
    쉼: 0.33
  - 키: F2
    단계: 2
    말: "사용할 아이디를 적고, 옆에 있는 중복확인을 눌러 주세요."
    속도: -1
    동작: 입력
    대상: 아이디
    칸: [{누를곳: "input[name=username]", 값: taekwon_demo, 이동: 0.7}]
    버튼: "button:has-text('중복확인')"
    버튼이동: 0.5
  - 키: F3
    단계: 2
    말: "비밀번호는 두 번 적어서, 한 번 더 확인합니다."
    속도: 1
    동작: 입력
    대상: 비밀번호
    칸:
      - {누를곳: "input[name=password]", 값: "demo1234!", 간격: 0.06, 이동: 0.5}
      - {누를곳: "input[name=chk_password]", 값: "demo1234!", 간격: 0.06, 이동: 0.4}
    강조: {모양: 세로}
  - 키: F4
    단계: 2
    말: "이름은, 성과 이름을 나눠서 적어 주세요."
    높낮이: -1
    동작: 입력
    대상: 이름
    먼저스크롤: {위치: 260, 시간: 0.8}
    칸:
      - {누를곳: "input[name=last_name]", 값: 김, 간격: 0.12, 다가가기: -60, 이동: 0.5}
      - {누를곳: "input[name=first_name]", 값: 태권, 간격: 0.12, 다가가기: -60, 이동: 0.4}
  - 키: F5
    단계: 2
    말: "휴대전화 번호를 적고, 인증요청을 누릅니다."
    속도: -1
    동작: 입력
    대상: 휴대전화
    칸: [{누를곳: "input[name=phone_number]", 값: "01000000000", 간격: 0.07, 다가가기: -120}]
    버튼: "button:has-text('인증요청')"
    강조: {왼쪽늘리기: 108}
  - 키: F6
    단계: 2
    말: "문자로 온 번호를 적고, 인증확인을 누르면 돼요."
    높낮이: 1
    동작: 입력
    대상: 인증번호
    칸: [{누를곳: "input[name=number_by_user]", 값: "000000", 간격: 0.1}]
    버튼: "button:has-text('인증확인')"
  - 키: F7
    단계: 2
    말: "인증은 처음 한 번만 하면 돼요."
    속도: 1
    높낮이: 2
    동작: 보여주기
    말풍선: 처음 한 번만!
  - 키: F8
    단계: 2
    말: "생년월일과 성별, 단은 목록에서 골라 주세요."
    동작: 선택
    대상: 생년월일·성별·단
    먼저스크롤: {위치: 600, 시간: 0.9}
    목록: [{상자: 2, 항목번호: 25}, {상자: 3, 항목번호: 4}, {상자: 4, 항목번호: 14}, {상자: 5, 항목번호: 0}, {상자: 6, 항목번호: 5}]
    강조: {모양: 세로, 너비: 500, 여백: 10, 유지: 0.3}

  # ── 3단계: 약관 동의하고 등록 ──
  - 키: T1
    단계: 3
    말: "마지막으로 전체 동의를 누르면, 약관이 한 번에 체크됩니다."
    속도: -2
    높낮이: 1
    동작: 체크
    대상: 전체 동의
    누를곳: "input[type=checkbox] >> nth=0"
    먼저스크롤: {위치: 10000, 시간: 0.9}
    먼저기다림비율: 0
    이동: 0.8
    앞당김: 1.6
    강조: {대상: "input[type=checkbox] >> nth=0 >> xpath=ancestor::div[3]", 여백: 6, 유지: 1.2, 시작: 이동}
  - 키: T2
    단계: 3
    말: "이제 등록 버튼을 누르면, 회원가입이 끝납니다."
    동작: 클릭
    대상: 등록
    누를곳: "button:has-text('등록')"
    앞당김: 0.6
