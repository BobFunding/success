# 한 번 해 보이기로 만든 장면 표. '말'만 다듬으면 됩니다(누를 곳·동작은 그대로 두세요).
제목: 사서 로그인하고 회원 등록하기, [4단계]면 끝!
주소: http://localhost:8765/index.html
브랜드: basic
시작상태: 로그아웃
단계이름:
- 사서 로그인 화면 찾기
- 사서 로그인 입력하기
- 회원 등록 화면 찾기
- 회원 등록 입력하기
인트로:
- 키: I1
  말: 안녕하세요.
- 키: I2
  말: 오늘은 사서 로그인하고 회원 등록하기 방법을, 네 단계로 알려 드릴게요.
아웃트로:
- 키: O1
  말: 오늘 배운 네 단계, 기억하시죠?
- 키: O2
  말: 고맙습니다.
장면:
- 키: S1
  단계: 1
  화면주소: http://localhost:8765/index.html
  동작: 클릭
  대상: 사서 로그인
  누를곳: a:has-text('사서 로그인')
  다음주소: '**/login.html'
  말: 먼저, 사서 로그인을 눌러 주세요.
- 키: S2
  단계: 2
  화면주소: http://localhost:8765/login.html
  동작: 입력
  대상: 아이디
  칸:
  - 누를곳: '#uid'
    값: librarian
  말: 아이디를 적어 주세요.
- 키: S3
  단계: 2
  화면주소: http://localhost:8765/login.html
  동작: 입력
  대상: 비밀번호
  칸:
  - 누를곳: '#upw'
    값: '@보관함'
  말: 비밀번호를 적어 주세요.
- 키: S4
  단계: 2
  화면주소: http://localhost:8765/login.html
  동작: 클릭
  대상: 로그인
  누를곳: button:has-text('로그인')
  다음주소: '**/admin.html'
  말: 로그인 버튼을 눌러 주세요.
- 키: S5
  단계: 3
  화면주소: http://localhost:8765/admin.html
  동작: 클릭
  대상: 회원 등록
  누를곳: a:has-text('회원 등록')
  먼저올리기: a:has-text('회원 관리 ▾')
  다음주소: '**/member-new.html'
  말: 회원 등록을 눌러 주세요.
- 키: S6
  단계: 4
  화면주소: http://localhost:8765/member-new.html
  동작: 입력
  대상: 이름
  칸:
  - 누를곳: '#mname'
    값: 김하늘
  말: 이름을 적어 주세요.
- 키: S7
  단계: 4
  화면주소: http://localhost:8765/member-new.html
  동작: 입력
  대상: 휴대전화
  칸:
  - 누를곳: '#mphone'
    값: 01012345678
  버튼: '#sms'
  버튼이름: 인증요청
  말: 휴대전화를 적고, 인증요청을 눌러 주세요.
- 키: S8
  단계: 4
  화면주소: http://localhost:8765/member-new.html
  동작: 입력
  대상: 인증번호
  칸:
  - 누를곳: '#mcode'
    값: '@물어보기:인증번호를 적어 주세요'
  말: 인증번호를 적어 주세요.
- 키: S9
  단계: 4
  화면주소: http://localhost:8765/member-new.html
  동작: 클릭
  대상: 저장
  누를곳: button:has-text('저장')
  말: 마지막으로, 저장 버튼을 누르면 끝이에요.
파일이름: localhost_8765_사서_로그인하고_회원_등록하기
개인정보칸:
- '#upw'
- '#mname'
- '#mphone'
- '#mcode'
요청차단:
- /member-new.html
