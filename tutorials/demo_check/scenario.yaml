# 한 번 해 보이기로 만든 장면 표. '말'만 다듬으면 됩니다(누를 곳·동작은 그대로 두세요).
제목: 도서관 회원가입, [3단계]면 끝!
주소: http://localhost:8765/index.html
브랜드: basic
시작상태: 로그아웃
단계이름:
- 회원 정보 입력 화면 찾기
- 회원 정보 입력하기
- 동의하고 가입하기
인트로:
- 키: I1
  말: 안녕하세요.
- 키: I2
  말: 오늘은 도서관 회원가입 방법을, 세 단계로 알려 드릴게요.
아웃트로:
- 키: O1
  말: 오늘 배운 세 단계, 기억하시죠?
- 키: O2
  말: 다음 영상에서는 책 빌리기 방법을 알려 드릴게요. 고맙습니다.
장면:
- 키: S1
  단계: 1
  동작: 클릭
  대상: 회원가입 하기
  누를곳: a:has-text('회원가입 하기')
  다음주소: '**/join.html'
  말: 먼저, 회원가입 하기를 눌러 주세요.
- 키: S2
  단계: 2
  동작: 입력
  대상: 이름
  칸:
  - 누를곳: '#name'
    값: 홍길동
  말: 이름을 적어 주세요.
- 키: S3
  단계: 2
  동작: 입력
  대상: 이메일
  칸:
  - 누를곳: '#email'
    값: reader@example.com
  버튼: '#check'
  말: 이메일을 적고, 중복 확인을 눌러 주세요.
- 키: S4
  단계: 2
  동작: 입력
  대상: 비밀번호
  칸:
  - 누를곳: '#pw'
    값: '@보관함'
  말: 비밀번호를 적어 주세요.
- 키: S5
  단계: 2
  동작: 입력
  대상: 비밀번호 확인
  칸:
  - 누를곳: '#pw2'
    값: '@보관함'
  말: 비밀번호 확인을 적어 주세요.
- 키: S6
  단계: 2
  동작: 선택
  대상: 관심 분야
  목록:
  - 누를곳: '#topic'
    항목: 과학
  말: 관심 분야는 목록에서 골라 주세요.
- 키: S7
  단계: 3
  동작: 체크
  대상: 이용 약관 동의
  누를곳: '#agree'
  말: 이용 약관 동의에 체크해 주세요.
- 키: S8
  단계: 3
  동작: 클릭
  대상: 가입하기
  누를곳: button:has-text('가입하기')
  말: 마지막으로, 가입하기 버튼을 누르면 끝이에요.
파일이름: localhost_8765_도서관_회원가입
다음편: 책 빌리기
개인정보칸:
- '#name'
- '#email'
- '#pw'
- '#pw2'
요청차단: /join.html
