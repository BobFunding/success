# 7편(파트 3 · 사람 모으기 3/3) 수련생, 학부모 초대. 공식 가이드 '초대장 발송하기(수련생 & 학부모)' + 지금 화면(목록에서 고르기).
# {ID} 는 실행할 때 TW_DEMO_ID 로 바뀜. 이 편만의 동작은 run_ep7.py.
# 안전: 목록 번호는 실제 사람 번호일 수 있다 → 확인 창의 [발송]은 보여 주기만 하고 누르지 않는다(+ 쓰기 요청 차단).
제목: 수련생, 학부모 초대 [3단계]면 끝!
파일이름: 태권월드_7편_수련생학부모초대
주소: https://taekwonworld.net/home
로그인주소: https://taekwonworld.net/account/login
브랜드: taekwonworld
시작상태: 로그인
단계이름: [초대 화면 열기, 초대할 사람 고르기, 초대장 보내기]
다음편: "8편: 차량 등록"
팝업닫기: false
개인정보칸:
  - input[name=username]
  - input[name=password]
요청차단: /invitation

미리하기:
  - 동작: 입력
    칸:
      - {대상: "input[name=username]", 값: "{ID}"}
      - {대상: "input[name=password]", 값: "@보관함"}
    버튼: "button[type=submit]:has-text('로그인'), button:text-is('로그인')"

인트로:
  - {키: I1, 말: "안녕하세요, 태권 월드입니다.", 속도: 2, 높낮이: 3}
  - {키: I2, 말: "오늘은 파트 3의 마지막, 수련생과 학부모님을 앱으로 초대하는 방법을 알려 드릴게요.", 속도: 0, 높낮이: 1}
아웃트로:
  - {키: O1, 말: "오늘 배운 세 단계, 기억하시죠? 이걸로 파트 3, 사람 모으기가 끝났어요.", 속도: 1, 높낮이: 2}
  - {키: O2, 말: "다음 영상에서는, 차량을 등록해 볼게요. 태권 월드였습니다.", 속도: 0, 높낮이: 1}

