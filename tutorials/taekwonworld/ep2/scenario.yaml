# 2편(로그인하고 도장 등록) 장면 표. {ID} 는 실행할 때 환경변수 TW_DEMO_ID 로 바뀜(파일에 계정 정보를 남기지 않음).
# 이 편만의 동작(파일 올리기, 주소 검색 창, 등록 뒤 목록으로)은 run_ep2.py 의 Ep2Recorder 가 처리한다.
제목: 로그인하고 도장 등록, [3단계]면 끝!
파일이름: 태권월드_2편_로그인하고도장등록
주소: https://taekwonworld.net/
브랜드: taekwonworld
시작상태: 로그아웃
단계이름: [로그인하고 도장 추가, 도장 정보 적기, 등록하고 첫 화면 보기]
다음편: "3편: 반 만들기"
팝업닫기: false          # '다시 보지 않기'를 누르면 계정 설정이 바뀌므로 자동 닫기를 끈다
개인정보칸:
  - input[name=username]
  - input[name=password]
  - input[name=phone_number]
  - input[name=road_address]
  - input[name=address_detail]
  - input[name=BR_number]
요청차단: /dojang/regist   # 도장 등록 화면: 태권월드 서버로 가는 요청과 모든 쓰기 요청을 막음(실제 등록 안 됨)

인트로:
  - {키: I1, 말: "안녕하세요, 태권 월드입니다.", 속도: 2, 높낮이: 3}
  - {키: I2, 말: "오늘은 로그인하고, 내 도장을 등록하는 방법을, 세 단계로 알려 드릴게요.", 속도: 0, 높낮이: 1}
아웃트로:
  - {키: O1, 말: "오늘 배운 세 단계, 기억하시죠?", 속도: 1, 높낮이: 2}
  - {키: O2, 말: "다음 영상에서는, 반 만드는 방법을 알려 드릴게요. 태권 월드였습니다.", 속도: 0, 높낮이: 1}

장면:
  # ── 1단계: 로그인하고 도장 추가 ──
  - 키: L1
    단계: 1
    말: "먼저, 첫 화면 오른쪽 위에 있는, 로그인 관장 버튼을 눌러 주세요."
    속도: -1
    동작: 클릭
    대상: 로그인(관장)
    누를곳: "button:has-text('로그인(관장)')"
    다음주소: "**/account/login"
    기다릴것: "input[name=username]"
  - 키: L2
    단계: 1
    말: "가입할 때 만든 아이디와 비밀번호를 적고, 로그인 버튼을 눌러 주세요."
    동작: 입력
    대상: 아이디·비밀번호
    칸:
      - {대상: "input[name=username]", 값: "{ID}"}
      - {대상: "input[name=password]", 값: "@보관함"}
    버튼: "button[type=submit]:has-text('로그인'), button:text-is('로그인')"
    강조: {모양: 세로}
  - 키: L3
    단계: 1
    말: "로그인하면 도장 목록이 나와요. 아래에 있는, 도장 추가를 눌러 주세요."
    높낮이: 1
    동작: 클릭
    대상: 도장 추가
    누를곳: "text=도장 추가 >> nth=-1"
    먼저기다림비율: 0.35
    다음주소: "**/dojang/regist"
    기다릴것: "input[name=dojang_name]"

  # ── 2단계: 도장 정보 적기 (파일·직인을 먼저: 사이트에서 파일을 올리면 먼저 적은 칸이 지워지는 현상이 있음) ──
  - 키: R1
    단계: 2
    말: "먼저, 파일 업로드를 눌러, 사업자 등록증을 올려 주세요."
    동작: 대기
    대상: 사업자 등록증
  - 키: R2
    단계: 2
    말: "사진 올리기를 눌러, 도장 로고도 올려 주세요."
    동작: 대기
    대상: 도장 로고
  - 키: R3
    단계: 2
    말: "도장 직인은, 사각이나 원형을 고르고, 들어갈 글자를 적으면 돼요."
    말풍선: "미리보기로 바로 확인!"
    동작: 대기
    대상: 도장 직인
  - 키: F1
    단계: 2
    말: "이제, 도장 이름과 전화번호를 적어 주세요."
    동작: 입력
    대상: 도장 이름·전화번호
    칸:
      - {대상: "input[name=dojang_name]", 값: "태권월드 태권도장"}
      - {대상: "input[name=phone_number]", 값: "0298765432"}
    강조: {모양: 세로}
  - 키: F2
    단계: 2
    말: "사업자 등록번호는, 빼기 표시 없이 숫자만 적어 주세요."
    동작: 입력
    대상: 사업자 등록번호
    칸:
      - {대상: "input[name=BR_number]", 값: "9876543210"}
  - 키: A1
    단계: 2
    말: "도장 주소 칸을 누르고, 주소를 검색해서 골라 주세요."
    동작: 대기
    대상: 도장 주소
  - 키: D1
    단계: 2
    말: "상세 주소도 적어 주세요."
    동작: 입력
    대상: 상세 주소
    칸:
      - {대상: "input[name=address_detail]", 값: "2층"}

  # ── 3단계: 등록하고 첫 화면 보기 ──
  - 키: G1
    단계: 3
    말: "다 적었으면, 오른쪽 위 등록 버튼을 눌러 주세요."
    동작: 대기
    대상: 등록
  - 키: H1
    단계: 3
    말: "도장 목록에서, 관리하러 가기를 눌러 주세요."
    동작: 클릭
    대상: 관리하러 가기
    누를곳: ".__tm_keep button:has-text('관리하러 가기')"
    다음주소: "**/home"
    기다릴것: "text=태권월드가 처음이신가요?"
  - 키: H2
    단계: 3
    말: "처음 들어오면, 시작 순서를 알려 주는 안내 창이 떠요."
    동작: 대기
    대상: 안내 창
  - 키: H3
    단계: 3
    말: "반 만들기부터 차량 등록까지, 이 순서대로 하시면 돼요."
    동작: 대기
    대상: 시작 순서
  - 키: H4
    단계: 3
    말: "창 닫기를 누르면, 첫 화면이 보여요."
    동작: 클릭
    대상: 창 닫기
    누를곳: "button:text-is('창 닫기')"
  - 키: H5
    단계: 3
    말: "왼쪽 메뉴에서, 수련생, 출결, 납부 같은 기능을 고를 수 있어요."
    동작: 대기
    대상: 왼쪽 메뉴
