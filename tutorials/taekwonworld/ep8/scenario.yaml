# 8편(파트 4 · 운영 시작 1/3) 차량 등록. 공식 가이드 '차량 관리(등록·조회·수정·삭제)' + 차량 현황(대시보드)·학부모님 앱의 차량(운행 상태).
# {ID} 는 실행할 때 TW_DEMO_ID 로 바뀜. 이 편만의 동작은 run_ep8.py. 학부모님 앱 화면은 phone/phone.html.
# 문장: 2~7편 발음 검사에서 틀어진 말(짧은 받침 단어 + 조사, '닫기를', '오른쪽 위,')은 피하고, 숫자·영문은 한글로 읽게 쓴다.
제목: 차량 등록, [3단계]면 끝!
파일이름: 태권월드_8편_차량등록
주소: https://taekwonworld.net/home
로그인주소: https://taekwonworld.net/account/login
브랜드: taekwonworld
시작상태: 로그인
단계이름: [차량 화면 열기, 차량 정보 적기, 등록하고 함께 보기]
다음편: "9편: 출결"
팝업닫기: false
개인정보칸:
  - input[name=username]
  - input[name=password]
요청차단: /manage/bus   # 차량 등록·저장·삭제(쓰기)를 막음 — 실제로 차량이 생기지 않음. 값은 모두 예시

미리하기:
  - 동작: 입력
    칸:
      - {대상: "input[name=username]", 값: "{ID}"}
      - {대상: "input[name=password]", 값: "@보관함"}
    버튼: "button[type=submit]:has-text('로그인'), button:text-is('로그인')"

인트로:
  - {키: I1, 말: "안녕하세요, 태권 월드입니다.", 속도: 2, 높낮이: 3}
  - {키: I2, 말: "오늘부터 파트 4, 운영 시작이에요. 먼저 도장 차량을 등록해 볼게요.", 속도: 0, 높낮이: 1}
아웃트로:
  - {키: O1, 말: "오늘 배운 세 단계, 기억하시죠? 이제 학부모님도 차량을 함께 볼 수 있어요.", 속도: 1, 높낮이: 2}
  - {키: O2, 말: "다음 영상에서는, 출결을 시작해 볼게요. 태권 월드였습니다.", 속도: 0, 높낮이: 1}

장면:
  # ── 1단계: 차량 화면 열기 ──
  - {키: P1, 단계: 1, 말: "첫 화면 안내 창에서, 마지막 순서인 차량 등록을 눌러 주세요.", 동작: 대기, 대상: 차량 등록}
  - {키: P2, 단계: 1, 말: "차량 사용 가이드가 나와요. 다 보셨으면, 아래쪽 닫기 버튼을 눌러 주세요.", 동작: 대기, 대상: 사용 가이드}

  # ── 2단계: 차량 정보 적기 ──
  - {키: N1, 단계: 2, 말: "화면 오른쪽 위에 있는, 차량 등록 버튼을 눌러 주세요.", 동작: 대기, 대상: 차량 등록 버튼}
  - {키: F1, 단계: 2, 말: "별표가 있는 차량 이름과 차량 번호는, 꼭 적어야 해요.", 동작: 대기, 대상: 차량 이름}
  - {키: F2, 단계: 2, 말: "차량 번호는, 번호판에 적힌 그대로 적어 주세요.", 동작: 대기, 대상: 차량 번호}
  - {키: F3, 단계: 2, 말: "차종과 인승은 꼭 적지 않아도 되지만, 적어 두면 알아보기 쉬워요.", 동작: 대기, 대상: 차종·인승}
  - {키: F4, 단계: 2, 말: "사진 추가를 누르면, 차량 사진을 세 장까지 올릴 수 있어요.", 동작: 대기, 대상: 사진 추가}
  - {키: F5, 단계: 2, 말: "사진은 삼십 메가 미만의 사진 파일만 돼요. 엑스 표시를 누르면 지워져요.", 말풍선: "jpg · jpeg · png, 30MB 미만", 동작: 대기, 대상: 차량 사진}
  - {키: F6, 단계: 2, 말: "차량 참고사항에는, 운행 시간 같은 메모를 남길 수 있어요.", 동작: 대기, 대상: 차량 참고사항}

  # ── 3단계: 등록하고 함께 보기 ──
  - {키: S1, 단계: 3, 말: "다 적으셨으면, 아래쪽 등록 버튼을 눌러 주세요.", 동작: 대기, 대상: 등록}
  - {키: S2, 단계: 3, 말: "등록한 차량은 목록에 나와요. 차량을 누르면, 정보를 보고 고칠 수 있어요.", 동작: 대기, 대상: 차량 목록}
  - {키: S3, 단계: 3, 말: "고친 뒤에는 저장을, 쓰지 않는 차량은 차량 삭제를 누르면 돼요.", 동작: 대기, 대상: 저장·차량 삭제}
  - {키: H1, 단계: 3, 말: "관장님 첫 화면의 차량 현황에서는, 차량마다 운행 중인지 바로 보여요.", 동작: 대기, 대상: 차량 현황}
  # 학부모님 휴대폰(phone/phone.html) — 7편에서 초대한 학부모님 앱. 차량 번호는 흐림
  - {키: M1, 단계: 3, 말: "7편에서 초대한 학부모님은, 태권 월드 앱의 차량 메뉴를 누르면 돼요.", 동작: 대기, 대상: 앱 차량 메뉴}
  - {키: M2, 단계: 3, 말: "관장님이 등록한 차량이, 학부모님 앱에도 그대로 보여요.", 동작: 대기, 대상: 앱 차량 목록}
  - {키: M3, 단계: 3, 말: "오른쪽 동그라미에서, 차량이 지금 운행 중인지 실시간으로 볼 수 있어요.", 동작: 대기, 대상: 운행 상태}
