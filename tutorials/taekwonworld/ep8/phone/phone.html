<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>학부모님 휴대폰 — 차량</title>
<!-- 8편 녹화용: 7편에서 초대한 학부모님의 태권월드 앱.
     1 = 앱 첫 화면(7편과 같은 캡처, 이름 흐림) → 차량 칸 / 2 = 차량 목록(사용자가 준 캡처를 본떠 다시 그림, 차량 번호 흐림).
     녹화기가 show(n) 으로 넘기고, 밝게 할 자리는 #hot-* . 차 사진은 가짜 그림(../sample_van.png). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #eef1f8; font-family: "Noto Sans KR", "WenQuanYi Zen Hei", sans-serif; overflow: hidden; }
  .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 90px; }
  .side { width: 540px; }
  .side .who { display: inline-block; background: #2e5cff; color: #fff; font-weight: 700; font-size: 22px; padding: 8px 18px; border-radius: 999px; }
  .side h1 { font-size: 46px; line-height: 1.3; margin: 22px 0 18px; color: #191919; }
  .side p { font-size: 24px; color: #4a5368; line-height: 1.6; margin: 0 0 18px; }
  .steps { list-style: none; padding: 0; margin: 0; }
  .steps li { font-size: 26px; color: #9aa3b5; padding: 12px 0; display: flex; gap: 14px; align-items: center; }
  .steps li b { width: 40px; height: 40px; border-radius: 50%; background: #dfe4ef; color: #fff; display: grid; place-items: center; font-size: 20px; }
  .steps li.on { color: #191919; font-weight: 700; }
  .steps li.on b { background: #2e5cff; }
  .steps li.done { color: #4a5368; }
  .steps li.done b { background: #36bd44; }
  .phone { position: relative; width: 430px; height: 900px; border-radius: 58px; background: #111; padding: 16px; box-shadow: 0 30px 70px rgba(20, 30, 70, .28); }
  .phone::before { content: ""; position: absolute; top: 26px; left: 50%; transform: translateX(-50%); width: 110px; height: 28px; background: #000; border-radius: 20px; z-index: 5; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 44px; overflow: hidden; background: #f1f2f5; }
  .page { position: absolute; inset: 0; opacity: 0; transition: opacity .45s ease; }
  .page.on { opacity: 1; }
  #p1 img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  /* 차량 목록(앱 화면을 본뜸) */
  .head { height: 118px; background: #2f5bff; color: #fff; display: flex; align-items: flex-end; padding: 0 22px 18px; gap: 26px; }
  .head span { font-size: 26px; line-height: 1; opacity: .9; }
  .head b { font-size: 30px; }
  .row { background: #fff; height: 132px; display: flex; align-items: center; padding: 0 18px; gap: 18px; border-bottom: 2px solid #eceef2; }
  .thumb { width: 92px; height: 70px; display: grid; place-items: center; }
  .thumb img { width: 92px; height: 62px; object-fit: cover; }
  .info { flex: 1; color: #6b7280; font-size: 18px; line-height: 1.45; }
  .info .n { color: #222; font-size: 22px; font-weight: 500; }
  .plate { filter: blur(7px); }
  .state { width: 86px; height: 86px; flex: none; border-radius: 50%; background: #c7c9cf; color: #fff; font-weight: 700; font-size: 15px; white-space: nowrap; display: grid; place-items: center; }
  .hot { position: absolute; pointer-events: none; }
</style>
</head>
<body>
<div class="stage">
  <div class="side">
    <span class="who">학부모님 휴대폰</span>
    <h1 id="title">앱에서 차량 보기</h1>
    <p>7편에서 초대한 학부모님의 태권월드 앱이에요.</p>
    <ol class="steps" id="steps">
      <li><b>1</b>앱 첫 화면에서 차량 누르기</li>
      <li><b>2</b>우리 도장 차량과 운행 상태 보기</li>
    </ol>
  </div>
  <div class="phone"><div class="screen" id="screen">
    <div class="page" id="p1"><img src="../../ep7/phone/4_app.jpg" alt="앱 첫 화면"></div>
    <div class="page" id="p2">
      <div class="head"><span>‹</span><b>차량</b></div>
      <div class="row" id="row1">
        <div class="thumb"><img src="../sample_van.png" alt=""></div>
        <div class="info"><div class="n">오전차량</div><div class="plate">12가3456</div><div>SUV</div></div>
        <div class="state">미운행 →</div>
      </div>
      <div class="row" id="row2">
        <div class="thumb"><svg width="46" height="52" viewBox="0 0 46 52"><rect x="3" y="2" width="40" height="40" rx="9" fill="#2f5bff"/><rect x="9" y="9" width="28" height="13" rx="2" fill="#fff"/><circle cx="13" cy="32" r="4" fill="#fff"/><circle cx="33" cy="32" r="4" fill="#fff"/><rect x="8" y="40" width="8" height="10" rx="2" fill="#2f5bff"/><rect x="30" y="40" width="8" height="10" rx="2" fill="#2f5bff"/></svg></div>
        <div class="info"><div class="n">오후차량</div><div class="plate">1조5000</div><div>스타렉스 12인승</div></div>
        <div class="state">미운행 →</div>
      </div>
    </div>
    <div class="hot" id="hot-1"></div><div class="hot" id="hot-2"></div><div class="hot" id="hot-3"></div>
  </div></div>
</div>
<script>
const titles = ["앱에서 차량 보기", "운행 상태가 보여요", "운행 상태가 보여요"];
// 밝게 할 자리: 1 차량 칸(캡처 위 비율) / 2 차량 목록 / 3 운행 상태 버튼 두 개(요소 위치로 계산)
function place() {
  const sc = document.getElementById('screen').getBoundingClientRect();
  const set = (k, x, y, w, h) => Object.assign(document.getElementById('hot-' + k).style,
    { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
  set(1, 0.725 * sc.width, 0.33 * sc.height, 0.20 * sc.width, 0.105 * sc.height);
  const rel = el => { const r = el.getBoundingClientRect(); return { x: r.x - sc.x, y: r.y - sc.y, w: r.width, h: r.height }; };
  const a = rel(document.getElementById('row1')), b = rel(document.getElementById('row2'));
  set(2, a.x, a.y, a.w, b.y + b.h - a.y);
  const [s1, s2] = [...document.querySelectorAll('.state')].map(rel);
  set(3, s1.x - 6, s1.y - 6, s1.w + 12, s2.y + s2.h - s1.y + 12);
}
function show(n) {
  const page = n === 1 ? 1 : 2;
  for (let i = 1; i <= 2; i++) document.getElementById('p' + i).classList.toggle('on', i === page);
  document.getElementById('title').textContent = titles[n - 1];
  [...document.getElementById('steps').children].forEach((li, i) => { li.className = i + 1 < page ? 'done' : i + 1 === page ? 'on' : ''; });
}
window.addEventListener('load', () => { place(); show(1); });
</script>
</body>
</html>
