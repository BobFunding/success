# 3편(파트 2 · 도장 뼈대 만들기 1/2) 반 만들기. 공식 가이드 '반 등록하기' 순서 그대로.
# {ID} 는 실행할 때 TW_DEMO_ID 로 바뀜(파일에 계정 정보를 남기지 않음). 이 편만의 동작은 run_ep3.py.
제목: 반 만들기, [3단계]면 끝!
파일이름: 태권월드_3편_반만들기
주소: https://taekwonworld.net/home      # 미리하기(로그인) 뒤 녹화를 시작할 화면
로그인주소: https://taekwonworld.net/account/login
브랜드: taekwonworld
시작상태: 로그인
단계이름: [반 관리 열기, 반 정보 적기, 저장하고 확인하기]
다음편: "4편: 급띠 체계 맞추기"
팝업닫기: false          # 첫 화면 안내 창에서 시작하므로 자동으로 닫지 않는다('다시 보지 않기'도 누르지 않음)
개인정보칸:
  - input[name=username]
  - input[name=password]
요청차단: /manage/class   # 반 화면: 반 만들기(쓰기) 요청을 막음 — 실제로 반이 생기지 않음

미리하기:                  # 영상에 들어가지 않음: 로그인 → 태권월드 태권도장 선택
  - 동작: 입력
    칸:
      - {대상: "input[name=username]", 값: "{ID}"}
      - {대상: "input[name=password]", 값: "@보관함"}
    버튼: "button[type=submit]:has-text('로그인'), button:text-is('로그인')"
    # 도장 고르기(태권월드 태권도장)는 run_ep3.py 의 run_pre 가 이어서 한다

인트로:
  - {키: I1, 말: "안녕하세요, 태권 월드입니다.", 속도: 2, 높낮이: 3}
  - {키: I2, 말: "오늘은 파트 2의 첫 번째, 반 만드는 방법을 알려 드릴게요.", 속도: 0, 높낮이: 1}
아웃트로:
  - {키: O1, 말: "오늘 배운 세 단계, 기억하시죠?", 속도: 1, 높낮이: 2}
  - {키: O2, 말: "반이 생겼으니, 다음 영상에서는 급띠 체계를 맞춰 볼게요. 태권 월드였습니다.", 속도: 0, 높낮이: 1}

장면:
  # ── 1단계: 반 관리 열기 ──
  - 키: P1
    단계: 1
    말: "첫 화면 안내 창에서, 첫 번째 순서인 반 만들기를 눌러 주세요."
    동작: 대기
    대상: 반 만들기
  - 키: P2
    단계: 1
    말: "처음 들어오면 반 사용 가이드가 나와요. 닫기를 눌러 주세요."
    동작: 대기
    대상: 닫기
  - 키: P3
    단계: 1
    말: "다음부터는, 왼쪽 메뉴의 도장 관리에서, 반을 누르면 이 화면이 열려요."
    동작: 대기
    대상: 도장 관리 · 반
  - 키: P4
    단계: 1
    말: "오른쪽 위, 반 만들기 버튼을 눌러 주세요."
    동작: 클릭
    대상: 반 만들기
    누를곳: "button:has-text('반 만들기')"
    기다릴것: "input[placeholder='반 이름을 입력해주세요.']"

  # ── 2단계: 반 정보 적기 ──
  - 키: F1
    단계: 2
    말: "반 이름을 적어 주세요. 수업 시간이나 나이처럼, 알아보기 쉬운 이름이 좋아요."
    동작: 입력
    대상: 반 이름
    칸:
      - {대상: "input[placeholder='반 이름을 입력해주세요.']", 값: "A반 오후 2시"}
  - 키: F2
    단계: 2
    말: "수업하는 요일을 체크해 주세요."
    동작: 대기
    대상: 수업 요일
  - 키: F3
    단계: 2
    말: "요일마다, 시작 시간과 끝나는 시간을 골라 주세요."
    동작: 대기
    대상: 시간
  - 키: F4
    단계: 2
    말: "다른 요일도, 같은 방법으로 골라 주세요."
    동작: 대기
    대상: 다른 요일 시간

  # ── 3단계: 저장하고 확인하기 ──
  - 키: S1
    단계: 3
    말: "다 적었으면, 저장을 눌러 주세요."
    동작: 대기
    대상: 저장
  - 키: S2
    단계: 3
    말: "반 목록에 새 반이 보이면, 완성이에요."
    말풍선: "누르면 언제든 고칠 수 있어요"
    동작: 대기
    대상: 반 목록
