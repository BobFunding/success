# 16편(파트 6 · 수련생 키우기 2/3) 체력평가. 공식 사용자 가이드에 아직 항목이 없는 새 기능이라(2026-10-15 확인) 화면 메뉴 순서(측정종목 관리 → 측정기록 등록 → 조회)를 따른다.
# {ID} 는 실행할 때 TW_DEMO_ID 로 바뀜. 이 편만의 동작은 run_ep16.py. 학부모님 휴대폰은 phone/phone.html(앱 첫 화면은 9편 사용자 캡처, 평가서는 웹 평가서를 옮김·이름 흐림).
# 조회·평가서는 데모 도장에 실제로 있는 2026년 9월 22일 기록. 측정기록 저장·종목 저장은 막는다(요청차단: /fitness). 이름·생년월일은 녹화할 때부터 흐린다.
제목: 체력평가 기록하기, [3단계]면 끝!
파일이름: 태권월드_16편_체력평가
주소: https://taekwonworld.net/home
로그인주소: https://taekwonworld.net/account/login
브랜드: taekwonworld
시작상태: 로그인
단계이름: [측정종목 고르기, 측정기록 적기, 결과 보기]
다음편: "17편: 헬스케어"
팝업닫기: false
개인정보칸:
  - input[name=username]
  - input[name=password]
요청차단: /fitness

미리하기:
  - 동작: 입력
    칸:
      - {대상: "input[name=username]", 값: "{ID}"}
      - {대상: "input[name=password]", 값: "@보관함"}
    버튼: "button[type=submit]:has-text('로그인'), button:text-is('로그인')"

인트로:
  - {키: I1, 말: "안녕하세요, 태권 월드입니다.", 속도: 2, 높낮이: 3}
  - {키: I2, 말: "오늘은 수련생의 체력을 재고, 결과를 평가서로 보는 방법을 알려 드릴게요.", 속도: 0, 높낮이: 1}
아웃트로:
  - {키: O1, 말: "오늘 배운 세 단계, 기억하시죠? 꾸준히 재면 아이가 얼마나 자랐는지 한눈에 보여요.", 속도: 1, 높낮이: 2}
  - {키: O2, 말: "다음 영상에서는, 헬스케어 측정 결과를 보는 방법을 알려 드릴게요. 태권 월드였습니다.", 속도: 0, 높낮이: 1}

장면:
  # ── 1단계: 측정종목 고르기 ──
  - {키: P1, 단계: 1, 말: "첫 화면 안내 창은, 아래쪽 창 닫기 버튼으로 닫아 주세요.", 동작: 대기, 대상: 창 닫기}
  - {키: P2, 단계: 1, 말: "왼쪽 메뉴의 체력평가에서, 측정종목 관리를 눌러 주세요.", 동작: 대기, 대상: 측정종목 관리}
  - {키: S1, 단계: 1, 말: "교육부 학생건강체력평가 기준으로, 체력 다섯 가지마다 종목이 있어요.", 동작: 대기, 대상: 측정종목}
  - {키: S2, 단계: 1, 말: "사용할 종목 선택에서, 우리 도장이 잴 종목을 골라요.", 동작: 대기, 대상: 사용할 종목 선택}
  - {키: S3, 단계: 1, 말: "필요하면 새 종목 추가로, 도장만의 종목도 만들 수 있어요.", 동작: 대기, 대상: 새 종목 추가}

  # ── 2단계: 측정기록 적기 ──
  - {키: R0, 단계: 2, 말: "이제 왼쪽 메뉴에서, 측정기록 등록을 눌러 주세요.", 동작: 대기, 대상: 측정기록 등록}
  - {키: R1, 단계: 2, 말: "측정한 날짜와 차수를 확인해요. 바꿀 때는 변경을 눌러요.", 동작: 대기, 대상: 날짜·차수}
  - {키: R2, 단계: 2, 말: "수련생 추가를 누르고, 측정한 수련생을 체크해서 추가해요.", 동작: 대기, 대상: 수련생 추가}
  - {키: R3, 단계: 2, 말: "위쪽 종목을 하나씩 누르면서, 기록을 적어 주세요.", 동작: 대기, 대상: 기록}
  - {키: R4, 단계: 2, 말: "다 적었으면, 오른쪽 위 저장 버튼을 눌러 주세요.", 동작: 대기, 대상: 저장}

  # ── 3단계: 결과 보기 ──
  - {키: Q1, 단계: 3, 말: "결과는 왼쪽 메뉴의 조회에서 봐요.", 동작: 대기, 대상: 조회}
  - {키: Q2, 단계: 3, 말: "달과 차수를 고르면, 체력마다 백분율과 등급, 종합등급이 나와요.", 동작: 대기, 대상: 결과}
  - {키: Q3, 단계: 3, 말: "평가서를 누르면, 그래프와 종합등급을 한눈에 볼 수 있어요.", 동작: 대기, 대상: 평가서}
  # 학부모님 휴대폰(phone/phone.html)
  - {키: M1, 단계: 3, 말: "학부모님은 태권 월드 앱 첫 화면에서, 체력평가를 누르면 돼요.", 동작: 대기, 대상: 앱 체력평가 메뉴}
  - {키: M2, 단계: 3, 말: "우리 아이 체력평가서를 휴대폰으로 바로 볼 수 있어요.", 동작: 대기, 대상: 앱 평가서}
