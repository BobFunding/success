# 14편(파트 5 · 학부모님과 소통 3/3) 일정. 공식 자료: 일정 사용 가이드 4단계(guide/common/app/schedule/app_schedule01~04).
# {ID} 는 실행할 때 TW_DEMO_ID 로 바뀜. 이 편만의 동작은 run_ep14.py. 학부모님 휴대폰은 phone/phone.html(앱 첫 화면은 9편 사용자 캡처, 일정 화면은 다시 그림).
# 데모 도장 10월 달력이 비어 있어, 녹화하는 브라우저 안에서만 예시 일정 3개를 읽기 응답에 보탠다(서버에 저장 없음, 9편 출결과 같은 방식).
# 영상 속 [등록]·[저장]·[삭제]는 막는다(요청차단: /app/schedule). 길이 목표 2분 안(RULES 2).
제목: 일정 올리기, [3단계]면 끝!
파일이름: 태권월드_14편_일정
주소: https://taekwonworld.net/home
로그인주소: https://taekwonworld.net/account/login
브랜드: taekwonworld
시작상태: 로그인
단계이름: [일정 화면 열기, 일정 추가하기, 고치고 지우기]
다음편: "15편: 승급"
팝업닫기: false
개인정보칸:
  - input[name=username]
  - input[name=password]
요청차단: /app/schedule

미리하기:
  - 동작: 입력
    칸:
      - {대상: "input[name=username]", 값: "{ID}"}
      - {대상: "input[name=password]", 값: "@보관함"}
    버튼: "button[type=submit]:has-text('로그인'), button:text-is('로그인')"

인트로:
  - {키: I1, 말: "안녕하세요, 태권 월드입니다.", 속도: 2, 높낮이: 3}
  - {키: I2, 말: "오늘은 파트 5의 마지막, 승급심사 같은 도장 일정을 달력에 올리는 방법이에요.", 속도: 0, 높낮이: 1}
아웃트로:
  - {키: O1, 말: "오늘 배운 세 단계, 기억하시죠? 이걸로 파트 5, 학부모님과 소통하기가 끝났어요.", 속도: 1, 높낮이: 2}
  - {키: O2, 말: "다음 영상에서는, 수련생 승급을 등록하는 방법을 알려 드릴게요. 태권 월드였습니다.", 속도: 0, 높낮이: 1}

장면:
  # ── 1단계: 일정 화면 열기 ──
  - {키: P1, 단계: 1, 말: "첫 화면 안내 창은, 아래쪽 창 닫기 버튼으로 닫아 주세요.", 동작: 대기, 대상: 창 닫기}
  - {키: P2, 단계: 1, 말: "왼쪽 메뉴의 앱에서, 일정을 눌러 주세요.", 동작: 대기, 대상: 일정}
  - {키: P3, 단계: 1, 말: "사용 가이드가 나와요. 다 보셨으면 아래쪽 닫기 버튼을 눌러 주세요.", 동작: 대기, 대상: 사용 가이드}
  - {키: P4, 단계: 1, 말: "한 달 일정이 달력에 보여요. 날짜를 누르면 오른쪽에 그날 일정이 나와요.", 동작: 대기, 대상: 달력}

  # ── 2단계: 일정 추가하기 ──
  - {키: A1, 단계: 2, 말: "오른쪽 위에 있는, 일정 추가를 눌러 주세요.", 동작: 대기, 대상: 일정 추가}
  - {키: A2, 단계: 2, 말: "시작 날짜를 누르고, 달력에서 날짜를 골라요.", 동작: 대기, 대상: 시작 날짜}
  - {키: A3, 단계: 2, 말: "종료 날짜도 골라요. 며칠 이어지는 일정도 만들 수 있어요.", 동작: 대기, 대상: 종료 날짜}
  - {키: A4, 단계: 2, 말: "일정 유형은 심사, 교육, 수련, 정기, 생일, 기타 중에서 골라요.", 동작: 대기, 대상: 일정 유형}
  - {키: A5, 단계: 2, 말: "제목과 내용은 꼭 적어 주세요.", 동작: 대기, 대상: 제목·내용}
  - {키: A6, 단계: 2, 말: "다 적었으면, 아래쪽 등록 버튼을 눌러 주세요.", 동작: 대기, 대상: 등록}

  # ── 3단계: 고치고 지우기 ──
  - {키: E1, 단계: 3, 말: "올린 일정은 달력에 색깔 점으로 보여요. 여러 날 일정은 날마다 나와요.", 동작: 대기, 대상: 달력 일정}
  - {키: E2, 단계: 3, 말: "고치고 싶은 날짜를 누르고, 오른쪽 일정을 눌러 주세요.", 동작: 대기, 대상: 그날 일정}
  - {키: E3, 단계: 3, 말: "내용을 고친 뒤 저장을 누르면 바뀌어요. 지울 때는 삭제를 눌러요.", 동작: 대기, 대상: 저장·삭제}
  # 학부모님 휴대폰(phone/phone.html)
  - {키: M1, 단계: 3, 말: "학부모님은 태권 월드 앱 첫 화면에서, 일정을 누르면 돼요.", 동작: 대기, 대상: 앱 일정 메뉴}
  - {키: M2, 단계: 3, 말: "도장 일정을 달력으로 보고, 미리 준비할 수 있어요.", 동작: 대기, 대상: 앱 일정}
