# 13편(파트 5 · 학부모님과 소통 2/3) 알림장. 공식 자료: 알림장 사용 가이드 8단계(guide/common/app/note/app_note01~08).
# {ID} 는 실행할 때 TW_DEMO_ID 로 바뀜. 이 편만의 동작은 run_ep13.py. 학부모님 휴대폰은 phone/phone.html(앱 첫 화면은 9편 사용자 캡처, 알림장 화면은 다시 그림).
# 데모 도장에 이미 보낸 알림장이 있어 그대로 보여 준다(실제 발송 없음). 수련생 이름은 녹화할 때부터 흐린다.
# 영상 속 [등록]·[삭제]·댓글은 막는다(요청차단: /app/note). 길이 목표 2분 안(RULES 2).
제목: 알림장 보내기, [3단계]면 끝!
파일이름: 태권월드_13편_알림장
주소: https://taekwonworld.net/home
로그인주소: https://taekwonworld.net/account/login
브랜드: taekwonworld
시작상태: 로그인
단계이름: [알림장 화면 열기, 알림장 쓰기, 확인하고 소통하기]
다음편: "14편: 일정"
팝업닫기: false
개인정보칸:
  - input[name=username]
  - input[name=password]
요청차단: /app/note

미리하기:
  - 동작: 입력
    칸:
      - {대상: "input[name=username]", 값: "{ID}"}
      - {대상: "input[name=password]", 값: "@보관함"}
    버튼: "button[type=submit]:has-text('로그인'), button:text-is('로그인')"

인트로:
  - {키: I1, 말: "안녕하세요, 태권 월드입니다.", 속도: 2, 높낮이: 3}
  - {키: I2, 말: "오늘은 수련생 한 명 한 명에게 소식을 전하는, 알림장 보내는 방법을 알려 드릴게요.", 속도: 0, 높낮이: 1}
아웃트로:
  - {키: O1, 말: "오늘 배운 세 단계, 기억하시죠? 공지는 반 전체에, 알림장은 아이 한 명에게 보내요.", 속도: 1, 높낮이: 2}
  - {키: O2, 말: "다음 영상에서는, 도장 일정을 올리는 방법을 알려 드릴게요. 태권 월드였습니다.", 속도: 0, 높낮이: 1}

장면:
  # ── 1단계: 알림장 화면 열기 ──
  - {키: P1, 단계: 1, 말: "첫 화면 안내 창은, 아래쪽 창 닫기 버튼으로 닫아 주세요.", 동작: 대기, 대상: 창 닫기}
  - {키: P2, 단계: 1, 말: "왼쪽 메뉴의 앱에서, 알림장을 눌러 주세요.", 동작: 대기, 대상: 알림장}
  - {키: P3, 단계: 1, 말: "사용 가이드가 나와요. 다 보셨으면 아래쪽 닫기 버튼을 눌러 주세요.", 동작: 대기, 대상: 사용 가이드}

  # ── 2단계: 알림장 쓰기 ──
  - {키: W1, 단계: 2, 말: "오른쪽 위의, 알림장 작성을 눌러 주세요.", 동작: 대기, 대상: 알림장 작성}
  - {키: W2, 단계: 2, 말: "먼저 받을 아이를 골라요. 수련생 선택을 눌러 주세요.", 동작: 대기, 대상: 수련생 선택}
  - {키: W3, 단계: 2, 말: "받을 수련생에 체크해요. 여러 명을 한 번에 고를 수도 있어요.", 동작: 대기, 대상: 체크}
  - {키: W4, 단계: 2, 말: "다 골랐으면, 오른쪽 위 선택 버튼을 눌러 주세요.", 동작: 대기, 대상: 선택}
  - {키: W5, 단계: 2, 말: "잘못 골랐다면, 선택 초기화로 처음부터 다시 고를 수 있어요.", 동작: 대기, 대상: 선택 초기화}
  - {키: W6, 단계: 2, 말: "내용은 꼭 적어 주세요. 천 자까지 쓸 수 있어요.", 동작: 대기, 대상: 내용}
  - {키: W7, 단계: 2, 말: "사진은 열 장까지 붙일 수 있어요. 아래쪽 등록 버튼을 누르면 끝!", 동작: 대기, 대상: 등록}

  # ── 3단계: 확인하고 소통하기 ──
  - {키: V1, 단계: 3, 말: "보낸 알림장은 목록에 나와요. 위쪽에서 반과 달을 골라 볼 수 있어요.", 동작: 대기, 대상: 목록}
  - {키: V2, 단계: 3, 말: "학부모님이 보낸 받은 알림장은 파란색이에요. 여기서 따로 볼 수 있어요.", 동작: 대기, 대상: 받은/보낸 알림장}
  - {키: V3, 단계: 3, 말: "알림장을 누르면, 학부모님과 댓글로 이야기할 수 있어요.", 동작: 대기, 대상: 알림장 보기}
  - {키: V4, 단계: 3, 말: "보낸 알림장은 점 세 개를 눌러 지워요. 받은 알림장은 못 지워요.", 동작: 대기, 대상: 삭제}
  # 학부모님 휴대폰(phone/phone.html)
  - {키: M1, 단계: 3, 말: "학부모님은 태권 월드 앱 첫 화면에서, 알림장을 누르면 돼요.", 동작: 대기, 대상: 앱 알림장 메뉴}
  - {키: M2, 단계: 3, 말: "선생님이 보낸 알림장을 보고, 댓글로 바로 답할 수 있어요.", 동작: 대기, 대상: 앱 알림장}
