# 15편(파트 6 · 수련생 키우기 1/3) 승급. 공식 자료: 승급 등록 사용 가이드 3단계(guide/.../levelup/regist/levelup_regist02~04), 승급 이력 사용 가이드 4단계(levelup/history/levelup_history01~05).
# {ID} 는 실행할 때 TW_DEMO_ID 로 바뀜. 이 편만의 동작은 run_ep15.py. 학부모님 휴대폰은 phone/phone.html(앱 첫 화면은 9편 사용자 캡처, 승급증은 웹 승급증을 옮김·이름 흐림).
# 승급 등록은 '태권월드에 공식 등록, 수정·취소 불가'라서 확인 창에서 [등록]은 가리키기만 하고 [취소]로 닫는다. 쓰기 요청도 모두 막는다(요청차단: /levelup).
# 승급증은 데모 도장에 실제로 있는 2026년 6월 승급 기록으로 보여 준다. 수련생 이름은 녹화할 때부터 흐린다.
제목: 승급 등록, [3단계]면 끝!
파일이름: 태권월드_15편_승급
주소: https://taekwonworld.net/home
로그인주소: https://taekwonworld.net/account/login
브랜드: taekwonworld
시작상태: 로그인
단계이름: [승급 등록하기, 승급 이력 보기, 승급증 확인하기]
다음편: "16편: 체력평가"
팝업닫기: false
개인정보칸:
  - input[name=username]
  - input[name=password]
요청차단: /levelup

미리하기:
  - 동작: 입력
    칸:
      - {대상: "input[name=username]", 값: "{ID}"}
      - {대상: "input[name=password]", 값: "@보관함"}
    버튼: "button[type=submit]:has-text('로그인'), button:text-is('로그인')"

인트로:
  - {키: I1, 말: "안녕하세요, 태권 월드입니다.", 속도: 2, 높낮이: 3}
  - {키: I2, 말: "오늘부터 파트 6, 수련생 키우기예요. 먼저 승급을 등록하고, 승급증을 보는 방법이에요.", 속도: 0, 높낮이: 1}
아웃트로:
  - {키: O1, 말: "오늘 배운 세 단계, 기억하시죠? 승급을 등록하면 승급증이 바로 만들어져요.", 속도: 1, 높낮이: 2}
  - {키: O2, 말: "다음 영상에서는, 체력평가를 기록하는 방법을 알려 드릴게요. 태권 월드였습니다.", 속도: 0, 높낮이: 1}

장면:
  # ── 1단계: 승급 등록하기 ──
  - {키: P1, 단계: 1, 말: "첫 화면 안내 창은, 아래쪽 창 닫기 버튼으로 닫아 주세요.", 동작: 대기, 대상: 창 닫기}
  - {키: P2, 단계: 1, 말: "왼쪽 메뉴의 승급에서, 승급 등록을 눌러 주세요.", 동작: 대기, 대상: 승급 등록}
  - {키: P3, 단계: 1, 말: "사용 가이드가 나와요. 다 보셨으면 아래쪽 닫기 버튼을 눌러 주세요.", 동작: 대기, 대상: 사용 가이드}
  - {키: R1, 단계: 1, 말: "승급할 수련생을 골라 체크하고, 오른쪽 위 선택을 눌러 주세요.", 동작: 대기, 대상: 수련생 선택}
  - {키: R2, 단계: 1, 말: "지금 띠와 올라갈 띠가 나와요. 다음 급으로 자동으로 정해져요.", 동작: 대기, 대상: 승급 급수}
  - {키: R3, 단계: 1, 말: "승급일을 확인하고, 아래쪽 승급 버튼을 눌러 주세요.", 동작: 대기, 대상: 승급}
  - {키: R4, 단계: 1, 말: "마지막으로 등록을 누르면 끝! 등록한 뒤에는 고치거나 취소할 수 없으니, 꼭 확인하세요.", 동작: 대기, 대상: 등록}

  # ── 2단계: 승급 이력 보기 ──
  - {키: H1, 단계: 2, 말: "승급한 기록은, 왼쪽 메뉴의 승급에서 조회를 눌러 봐요.", 동작: 대기, 대상: 조회}
  - {키: H2, 단계: 2, 말: "사용 가이드는 아래쪽 닫기 버튼으로 닫아 주세요.", 동작: 대기, 대상: 사용 가이드}
  - {키: H3, 단계: 2, 말: "위쪽에서 달을 고르면, 그달에 승급한 수련생이 나와요.", 동작: 대기, 대상: 승급 이력}
  - {키: H4, 단계: 2, 말: "잘못 올린 기록은 이력 삭제로 지워요. 띠는 수련생 정보에서 따로 바꿔 주세요.", 동작: 대기, 대상: 이력 삭제}

  # ── 3단계: 승급증 확인하기 ──
  - {키: C1, 단계: 3, 말: "승급증 버튼을 누르면, 승급증이 바로 나와요.", 동작: 대기, 대상: 승급증}
  - {키: C2, 단계: 3, 말: "공식 승급증과 태권 월드 승급증, 두 가지로 볼 수 있어요.", 동작: 대기, 대상: 승급증 유형}
  - {키: C3, 단계: 3, 말: "오른쪽 위 인쇄 아이콘을 누르면, 바로 인쇄할 수 있어요.", 동작: 대기, 대상: 인쇄}
  # 학부모님 휴대폰(phone/phone.html)
  - {키: M1, 단계: 3, 말: "학부모님은 태권 월드 앱 첫 화면에서, 승급을 누르면 돼요.", 동작: 대기, 대상: 앱 승급 메뉴}
  - {키: M2, 단계: 3, 말: "우리 아이 승급증을 휴대폰으로 언제든지 볼 수 있어요.", 동작: 대기, 대상: 앱 승급증}
