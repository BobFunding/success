# 21편(파트 8 · 고치고 정리하기 3/7) 사범 관리. 공식 가이드에 사범 관리 항목이 따로 없어(초대는 5편, 소속반은 22편) 화면 순서대로:
# 도장 관리 > 사범(/manage/sabum/list) → 사범 정보(/manage/sabum/detail) → 맨 아래 퇴사. 화면 사용 가이드 창도 없음.
# {ID} 는 실행할 때 TW_DEMO_ID 로 바뀜. 이 편만의 동작은 run_ep21.py. 퇴사는 가리키기만 한다(요청차단: /manage/sabum).
# 사범님 사진·이름·생년월일·전화번호·이메일·자격증 일련번호는 녹화할 때부터 흐린다.
제목: 사범님 관리, [3단계]면 끝!
파일이름: 태권월드_21편_사범관리
주소: https://taekwonworld.net/home
로그인주소: https://taekwonworld.net/account/login
브랜드: taekwonworld
시작상태: 로그인
단계이름: [사범 목록 보기, 사범 정보 보기, 퇴사 정리하기]
다음편: "22편: 반 관리"
팝업닫기: false
개인정보칸:
  - input[name=username]
  - input[name=password]
요청차단: /manage/sabum

미리하기:
  - 동작: 입력
    칸:
      - {대상: "input[name=username]", 값: "{ID}"}
      - {대상: "input[name=password]", 값: "@보관함"}
    버튼: "button[type=submit]:has-text('로그인'), button:text-is('로그인')"

인트로:
  - {키: I1, 말: "안녕하세요, 태권 월드입니다.", 속도: 2, 높낮이: 3}
  - {키: I2, 말: "오늘은 우리 도장 사범님들의 정보를 한눈에 보고 관리하는 방법이에요.", 속도: 0, 높낮이: 1}
아웃트로:
  - {키: O1, 말: "오늘 배운 세 단계, 기억하시죠? 사범님 명단도 늘 깔끔하게 관리해 보세요.", 속도: 1, 높낮이: 2}
  - {키: O2, 말: "다음 영상에서는, 반을 관리하고 소속반을 바꾸는 방법을 알려 드릴게요. 태권 월드였습니다.", 속도: 0, 높낮이: 1}

장면:
  # ── 1단계: 사범 목록 보기 ──
  - {키: P1, 단계: 1, 말: "첫 화면 안내 창은, 아래쪽 창 닫기 버튼으로 닫아 주세요.", 동작: 대기, 대상: 창 닫기}
  - {키: P2, 단계: 1, 말: "왼쪽 메뉴의 도장 관리에서, 사범을 눌러 주세요.", 동작: 대기, 대상: 사범}
  - {키: M1, 단계: 1, 말: "초대장으로 가입한 사범님들이 여기 모여 있어요.", 동작: 대기, 대상: 사범 목록}
  - {키: M2, 단계: 1, 말: "단과 휴대전화, 입사일, 맡은 반 수를 한 줄로 볼 수 있어요.", 동작: 대기, 대상: 목록 칸}
  - {키: M3, 단계: 1, 말: "전체반을 눌러 반을 고르면, 그 반을 맡은 사범님만 나와요.", 동작: 대기, 대상: 전체반}

  # ── 2단계: 사범 정보 보기 ──
  - {키: D1, 단계: 2, 말: "사범님 줄을 누르면, 사범 정보가 열려요.", 동작: 대기, 대상: 사범님 줄}
  - {키: D2, 단계: 2, 말: "사진과 이름, 연락처 같은 기본 정보와 단을 확인할 수 있어요.", 동작: 대기, 대상: 기본 정보}
  - {키: D3, 단계: 2, 말: "아래로 내리면 학력과 자격증, 수상 이력, 경력까지 한눈에 보여요.", 동작: 대기, 대상: 자격증}

  # ── 3단계: 퇴사 정리하기 ──
  - {키: X1, 단계: 3, 말: "도장을 그만둔 사범님은, 맨 아래 퇴사를 눌러 정리해요.", 동작: 대기, 대상: 퇴사}
  - {키: X2, 단계: 3, 말: "왼쪽 위 화살표를 누르면, 사범 목록으로 돌아가요.", 동작: 대기, 대상: 뒤로}
