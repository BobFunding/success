# 9편(파트 4 · 운영 시작 2/4) 출결 관리. 공식 가이드 '출결 관리' 사용 가이드(7단계) + '태권월드-QR 출석관리 서비스 App 사용자 가이드'(PDF).
# {ID} 는 실행할 때 TW_DEMO_ID 로 바뀜. 이 편만의 동작은 run_ep9.py. QR 앱 그림은 phone/qr.html, 학부모님 휴대폰은 phone/phone.html.
# 예시 날짜는 기록이 없는 2026-10-13. 저장 요청은 서버로 보내지 않고 화면에서만 성공한 것처럼 보여 준다(실제 기록·알림 없음).
# 문장: 발음 검사에서 틀어진 말(짧은 받침 단어+조사, '닫기를', '오른쪽 위,')은 피하고, QR 은 '큐알'로 읽게 쓴다.
제목: 출결 관리, [3단계]면 끝!
파일이름: 태권월드_9편_출결관리
주소: https://taekwonworld.net/home
로그인주소: https://taekwonworld.net/account/login
브랜드: taekwonworld
시작상태: 로그인
단계이름: [출결 관리 열기, 출석 체크하기, 출결 확인하기]
다음편: "10편: 납부 설정, 청구서 발행"
팝업닫기: false
개인정보칸:
  - input[name=username]
  - input[name=password]
요청차단: /attendance   # 출결 저장은 화면에서만(가짜 성공), 그 밖의 쓰기는 막음

미리하기:
  - 동작: 입력
    칸:
      - {대상: "input[name=username]", 값: "{ID}"}
      - {대상: "input[name=password]", 값: "@보관함"}
    버튼: "button[type=submit]:has-text('로그인'), button:text-is('로그인')"

인트로:
  - {키: I1, 말: "안녕하세요, 태권 월드입니다.", 속도: 2, 높낮이: 3}
