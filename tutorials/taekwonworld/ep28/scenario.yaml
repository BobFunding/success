# 28편(파트 9 · 계정 도움말 3/3, 시리즈 마지막) 로그아웃·회원 탈퇴. 공식 가이드 '로그아웃하기' + '회원 탈퇴하기'.
# 왼쪽 맨 위 ≡ → 프로필 창 '로그아웃' 위치 → '내 정보' → 맨 아래 '탈퇴하기' → 확인 창('탈퇴하기'는 가리키기만, '취소'로 닫음) → ≡ → 로그아웃(실제로 누름: 계정은 바뀌지 않음, 서비스 첫 화면으로 감).
# {ID} 는 실행할 때 TW_DEMO_ID 로 바뀜. 이 편만의 동작은 run_ep28.py. 탈퇴는 절대 누르지 않는다(요청차단: /mypage).
제목: 로그아웃과 회원 탈퇴, [3단계]면 끝!
파일이름: 태권월드_28편_로그아웃회원탈퇴
주소: https://taekwonworld.net/home
로그인주소: https://taekwonworld.net/account/login
브랜드: taekwonworld
시작상태: 로그인
단계이름: [로그아웃 버튼 찾기, 회원 탈퇴 알아보기, 로그아웃하기]
팝업닫기: false
개인정보칸:
  - input[name=username]
  - input[name=password]
  - input[name=last_name]
  - input[name=first_name]
요청차단: /mypage

미리하기:
  - 동작: 입력
    칸:
      - {대상: "input[name=username]", 값: "{ID}"}
      - {대상: "input[name=password]", 값: "@보관함"}
    버튼: "button[type=submit]:has-text('로그인'), button:text-is('로그인')"

인트로:
  - {키: I1, 말: "안녕하세요, 태권 월드입니다.", 속도: 2, 높낮이: 3}
  - {키: I2, 말: "오늘은 시리즈 마지막 편, 로그아웃과 회원 탈퇴 방법이에요.", 속도: 0, 높낮이: 1}
아웃트로:
  - {키: O1, 말: "오늘 배운 세 단계, 기억하시죠? 공용 컴퓨터에서는 꼭 로그아웃해 주세요.", 속도: 1, 높낮이: 2}
  - {키: O2, 말: "지금까지 태권 월드 사용법을 함께해 주셔서 감사합니다. 태권 월드였습니다.", 속도: 0, 높낮이: 1}

장면:
  # ── 1단계: 로그아웃 버튼 찾기 ──
  - {키: P1, 단계: 1, 말: "첫 화면 안내 창은, 아래쪽 창 닫기 버튼으로 닫아 주세요.", 동작: 대기, 대상: 창 닫기}
  - {키: A1, 단계: 1, 말: "왼쪽 맨 위, 줄 세 개 버튼을 눌러 주세요.", 동작: 대기, 대상: 메뉴 버튼}
  - {키: A2, 단계: 1, 말: "내 프로필 아래에 로그아웃 버튼이 있어요. 도장 선택 화면 오른쪽 위에도 있어요.", 동작: 대기, 대상: 로그아웃}

  # ── 2단계: 회원 탈퇴 알아보기 ──
  - {키: W1, 단계: 2, 말: "회원 탈퇴는 같은 곳의 내 정보에서 해요.", 동작: 대기, 대상: 내 정보}
  - {키: W2, 단계: 2, 말: "맨 아래 오른쪽 탈퇴하기를 누르면, 확인 창이 나와요.", 동작: 대기, 대상: 탈퇴하기}
  - {키: W3, 단계: 2, 말: "탈퇴하면 아이디를 다시 쓰거나 되살릴 수 없어요. 꼭 신중하게 정해 주세요.", 동작: 대기, 대상: 회원 탈퇴}
  - {키: W4, 단계: 2, 말: "그만두려면 취소를 누르면 돼요.", 동작: 대기, 대상: 취소}

  # ── 3단계: 로그아웃하기 ──
  - {키: L4, 단계: 3, 말: "이제 진짜로 로그아웃해 볼게요. 줄 세 개 버튼을 다시 눌러 주세요.", 동작: 대기, 대상: 메뉴 버튼}
  - {키: L5, 단계: 3, 말: "로그아웃을 누르면, 태권 월드 첫 화면으로 돌아가요.", 동작: 대기, 대상: 로그아웃}
