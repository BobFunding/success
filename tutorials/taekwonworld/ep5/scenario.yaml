# 5편(파트 3 · 사람 모으기 1/3) 사범님 초대, 반 배정. 공식 가이드 '초대장 발송하기(관장 & 사범)' + '사범님 소속반 추가하기'.
# {ID} 는 실행할 때 TW_DEMO_ID 로 바뀜. 이 편만의 동작은 run_ep5.py.
제목: 사범님 초대, 반 배정 [3단계]면 끝!
파일이름: 태권월드_5편_사범님초대반배정
주소: https://taekwonworld.net/home      # 미리하기(로그인) 뒤 녹화를 시작할 화면
로그인주소: https://taekwonworld.net/account/login
브랜드: taekwonworld
시작상태: 로그인
단계이름: [사범님 초대하기, 반 열기, 담당 사범님 넣기]
다음편: "6편: 수련생 등록"
팝업닫기: false
개인정보칸:
  - input[name=username]
  - input[name=password]
  - "input[name='invite_list.0.phone_number']"
요청차단: [/invitation, /manage/class]   # 초대장 보내기·담당 추가(쓰기)를 막음 — 실제로 문자가 가거나 반이 바뀌지 않음

미리하기:
  - 동작: 입력
    칸:
      - {대상: "input[name=username]", 값: "{ID}"}
      - {대상: "input[name=password]", 값: "@보관함"}
    버튼: "button[type=submit]:has-text('로그인'), button:text-is('로그인')"

인트로:
  - {키: I1, 말: "안녕하세요, 태권 월드입니다.", 속도: 2, 높낮이: 3}
  - {키: I2, 말: "오늘은 파트 3의 첫 번째, 사범님을 초대하고 반에 넣는 방법을 알려 드릴게요.", 속도: 0, 높낮이: 1}
아웃트로:
  - {키: O1, 말: "오늘 배운 세 단계, 기억하시죠?", 속도: 1, 높낮이: 2}
  - {키: O2, 말: "다음 영상에서는, 수련생을 등록해 볼게요. 태권 월드였습니다.", 속도: 0, 높낮이: 1}

장면:
  # ── 1단계: 사범님 초대하기 ──
  - {키: P1, 단계: 1, 말: "첫 화면 안내 창에서, 세 번째 순서인 사범님 초대, 반 배정을 눌러 주세요.", 동작: 대기, 대상: 사범님 초대, 반 배정}
  - {키: P2, 단계: 1, 말: "사용 가이드가 나오면, 닫기를 눌러 주세요.", 동작: 대기, 대상: 닫기}
  - {키: V1, 단계: 1, 말: "회원 유형에서 사범을 골라 주세요. 유형이 틀리면 초대장을 받을 수 없어요.", 동작: 대기, 대상: 회원 유형}
  - 키: V2
    단계: 1
    말: "사범님 휴대전화 번호를, 빼기 없이 숫자만 적어 주세요."
    동작: 입력
    대상: 휴대전화 번호
    칸:
      - {대상: "input[name='invite_list.0.phone_number']", 값: "01098765432"}
  - {키: V3, 단계: 1, 말: "초대장 보내기를 누르면 끝이에요. 사범님이 초대를 수락하면, 반에 넣을 수 있어요.", 동작: 대기, 대상: 초대장 보내기}

  # ── 2단계: 반 열기 ──
  - {키: C1, 단계: 2, 말: "이제 왼쪽 메뉴의 도장 관리에서, 반을 눌러 주세요.", 동작: 대기, 대상: 도장 관리 · 반}
  - {키: C2, 단계: 2, 말: "사범님을 넣을 반을 눌러 주세요.", 동작: 대기, 대상: A반 오후 2시}

  # ── 3단계: 담당 사범님 넣기 ──
  - {키: T1, 단계: 3, 말: "담당 사범님 오른쪽의, 담당 추가를 눌러 주세요.", 동작: 대기, 대상: 담당 추가}
  - {키: T2, 단계: 3, 말: "초대를 수락한 사범님이 보여요. 이 반을 맡을 사범님을 골라 주세요.", 동작: 대기, 대상: 사범님}
  - {키: T3, 단계: 3, 말: "추가를 누르면, 이 반의 담당 사범님이 돼요.", 동작: 대기, 대상: 추가}
