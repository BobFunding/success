# 19편(파트 8 · 고치고 정리하기 1/7) 대시보드. 공식 사용자 가이드에 항목 없음. 첫 화면(홈) 카드 → 대시보드 네 칸 순서로.
# 사용자 확인(2026-10-16): '도장 현황을 어디서 보나' 이야기 — 1 첫 화면에서 오늘 보기 / 2 대시보드로 흐름 보기 / 3 납부와 반 살피기, 마무리는 '이상하면 앞에서 배운 메뉴로 고친다'.
# 데모 도장 이달 납부율·출석률이 비어 있어, 녹화 브라우저 안에서만 읽기 응답에 예시 숫자를 넣는다(서버 저장 없음, 14편 일정과 같은 방식).
# {ID} 는 실행할 때 TW_DEMO_ID 로 바뀜. 이 편만의 동작은 run_ep19.py.
제목: 대시보드 보기, [3단계]면 끝!
파일이름: 태권월드_19편_대시보드
주소: https://taekwonworld.net/home
로그인주소: https://taekwonworld.net/account/login
브랜드: taekwonworld
시작상태: 로그인
단계이름: [첫 화면에서 오늘 보기, 대시보드로 흐름 보기, 납부와 반 살피기]
다음편: "20편: 수련생 관리"
팝업닫기: false
개인정보칸:
  - input[name=username]
  - input[name=password]
요청차단: /dashboard

미리하기:
  - 동작: 입력
    칸:
      - {대상: "input[name=username]", 값: "{ID}"}
      - {대상: "input[name=password]", 값: "@보관함"}
    버튼: "button[type=submit]:has-text('로그인'), button:text-is('로그인')"

인트로:
  - {키: I1, 말: "안녕하세요, 태권 월드입니다.", 속도: 2, 높낮이: 3}
  - {키: I2, 말: "오늘부터 파트 8, 고치고 정리하기예요. 먼저 도장 현황을 한눈에 보는 대시보드예요.", 속도: 0, 높낮이: 1}
아웃트로:
  - {키: O1, 말: "오늘 배운 세 단계, 기억하시죠? 대시보드로 도장 살림을 한눈에 살펴보세요.", 속도: 1, 높낮이: 2}
  - {키: O2, 말: "다음 영상에서는, 수련생 정보를 고치고 휴관을 관리하는 방법을 알려 드릴게요. 태권 월드였습니다.", 속도: 0, 높낮이: 1}

장면:
  # ── 1단계: 첫 화면에서 오늘 보기 ──
  - {키: P1, 단계: 1, 말: "첫 화면 안내 창은, 아래쪽 창 닫기 버튼으로 닫아 주세요.", 동작: 대기, 대상: 창 닫기}
  - {키: H1, 단계: 1, 말: "첫 화면에서는 오늘 출결과 초대장, 차량 현황을 바로 볼 수 있어요.", 동작: 대기, 대상: 오늘 현황}
  - {키: H2, 단계: 1, 말: "수련비 납부 현황과 이번 달 일정도, 첫 화면에 함께 나와요.", 동작: 대기, 대상: 납부·일정}

  # ── 2단계: 대시보드로 흐름 보기 ──
  - {키: P2, 단계: 2, 말: "더 자세히 볼 때는, 왼쪽 메뉴의 대시보드를 눌러 주세요.", 동작: 대기, 대상: 대시보드}
  - {키: D1, 단계: 2, 말: "월별 소속 수련생 수에서, 수련생이 늘었는지 줄었는지 한눈에 봐요.", 동작: 대기, 대상: 월별 소속 수련생 수}
  - {키: D2, 단계: 2, 말: "급, 품, 단 수련생 통계에서는, 띠마다 수련생이 몇 명인지 보여요.", 동작: 대기, 대상: 급/품/단 수련생 통계}

  # ── 3단계: 납부와 반 살피기 ──
  - {키: D3, 단계: 3, 말: "이달 수련비 납부율에서, 낸 수련생과 안 낸 수련생 수를 확인해요.", 동작: 대기, 대상: 수련비 납부율}
  - {키: D4, 단계: 3, 말: "반 정보에서는 반마다 수련생 수와 사범님 수, 어제와 오늘 출석률이 나와요.", 동작: 대기, 대상: 반 정보}
  - {키: D5, 단계: 3, 말: "숫자가 이상하면, 앞에서 배운 메뉴로 가서 바로 고치면 돼요.", 동작: 대기, 대상: 왼쪽 메뉴}
