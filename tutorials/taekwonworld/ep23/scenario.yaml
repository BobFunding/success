# 23편(파트 8 · 고치고 정리하기 5/7) 초대장 관리. 공식 가이드 '초대장 발송하기'의 조회·취소 부분(보내기는 5·7편):
# 초대장 > 조회(/invitation/inquiry) → 받는 사람·관계·번호·상태·만료일 → 삭제(취소, 가리키기만) → 초대장 발송(가리키기만). 화면 사용 가이드 창 없음.
# {ID} 는 실행할 때 TW_DEMO_ID 로 바뀜. 이 편만의 동작은 run_ep23.py. 삭제·발송은 가리키기만 한다(요청차단: /invitation).
# 받는 사람 이름과 전화번호는 녹화할 때부터 흐린다.
제목: 초대장 관리, [3단계]면 끝!
파일이름: 태권월드_23편_초대장관리
주소: https://taekwonworld.net/home
로그인주소: https://taekwonworld.net/account/login
브랜드: taekwonworld
시작상태: 로그인
단계이름: [초대장 목록 열기, 가입 상태 보기, 취소하고 다시 보내기]
다음편: "24편: 도장 정보"
팝업닫기: false
개인정보칸:
  - input[name=username]
  - input[name=password]
요청차단: /invitation

미리하기:
  - 동작: 입력
    칸:
      - {대상: "input[name=username]", 값: "{ID}"}
      - {대상: "input[name=password]", 값: "@보관함"}
    버튼: "button[type=submit]:has-text('로그인'), button:text-is('로그인')"

인트로:
  - {키: I1, 말: "안녕하세요, 태권 월드입니다.", 속도: 2, 높낮이: 3}
  - {키: I2, 말: "오늘은 보낸 초대장을 확인하고, 잘못 보낸 초대장을 정리하는 방법이에요.", 속도: 0, 높낮이: 1}
아웃트로:
  - {키: O1, 말: "오늘 배운 세 단계, 기억하시죠? 초대장이 잘 갔는지 가끔 확인해 보세요.", 속도: 1, 높낮이: 2}
  - {키: O2, 말: "다음 영상에서는, 도장 정보를 바꾸고 정리하는 방법을 알려 드릴게요. 태권 월드였습니다.", 속도: 0, 높낮이: 1}

장면:
  # ── 1단계: 초대장 목록 열기 ──
  - {키: P1, 단계: 1, 말: "첫 화면 안내 창은, 아래쪽 창 닫기 버튼으로 닫아 주세요.", 동작: 대기, 대상: 창 닫기}
  - {키: P2, 단계: 1, 말: "왼쪽 메뉴의 초대장에서, 조회를 눌러 주세요.", 동작: 대기, 대상: 조회}
  - {키: M1, 단계: 1, 말: "지금까지 보낸 초대장이 여기 모두 나와요.", 동작: 대기, 대상: 초대장 목록}

  # ── 2단계: 가입 상태 보기 ──
  - {키: S1, 단계: 2, 말: "누구에게 어떤 관계로, 어느 번호로 보냈는지 볼 수 있어요.", 동작: 대기, 대상: 받는 사람}
  - {키: S2, 단계: 2, 말: "상태 칸에서는, 받은 분이 앱에 가입했는지 알 수 있어요.", 동작: 대기, 대상: 상태}
  - {키: S3, 단계: 2, 말: "초대장은 7일이 지나면 저절로 지워지니, 만료일도 확인해 주세요.", 동작: 대기, 대상: 만료일}

  # ── 3단계: 취소하고 다시 보내기 ──
  - {키: D1, 단계: 3, 말: "번호를 잘못 보냈다면, 오른쪽 삭제를 눌러 초대를 취소해요.", 동작: 대기, 대상: 삭제}
  - {키: D2, 단계: 3, 말: "다시 보낼 때는, 오른쪽 위 초대장 발송을 누르면 돼요.", 동작: 대기, 대상: 초대장 발송}
  - {키: D3, 단계: 3, 말: "받은 분이 초대를 수락하면, 목록에서 저절로 사라져요.", 동작: 대기, 대상: 초대장 목록}
