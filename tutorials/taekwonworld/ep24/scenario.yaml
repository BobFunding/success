# 24편(파트 8 · 고치고 정리하기 6/7) 도장 정보. 공식 가이드 '도장 정보 조회하기' + '도장 변경 & 삭제하기'.
# 도장 관리 > 도장(/manage/dojang) → 저장(가리키기만) → 왼쪽 위 ⋮ '등록된 도장 보기'(/dojang/select) → 관리하러 가기(가리키기만) → 카드 ⋮ '삭제'(가리키기만).
# {ID} 는 실행할 때 TW_DEMO_ID 로 바뀜. 이 편만의 동작은 run_ep24.py. 저장·삭제는 절대 누르지 않는다(요청차단: /manage/dojang, /dojang/select).
# 도장 전화번호·주소·사업자 등록번호·등록증·직인, 다른 도장 카드는 녹화할 때부터 흐린다(다른 도장 카드는 2편 규칙).
제목: 도장 정보 관리, [3단계]면 끝!
파일이름: 태권월드_24편_도장정보
주소: https://taekwonworld.net/home
로그인주소: https://taekwonworld.net/account/login
브랜드: taekwonworld
시작상태: 로그인
단계이름: [도장 정보 고치기, 다른 도장으로 바꾸기, 도장 삭제하기]
다음편: "25편: 내 정보"
팝업닫기: false
개인정보칸:
  - input[name=username]
  - input[name=password]
  - input[name=phone_number]
  - input[name=road_address]
  - input[name=address_detail]
  - input[name=BR_number]
요청차단: [/manage/dojang, /dojang/select]

미리하기:
  - 동작: 입력
    칸:
      - {대상: "input[name=username]", 값: "{ID}"}
      - {대상: "input[name=password]", 값: "@보관함"}
    버튼: "button[type=submit]:has-text('로그인'), button:text-is('로그인')"

인트로:
  - {키: I1, 말: "안녕하세요, 태권 월드입니다.", 속도: 2, 높낮이: 3}
  - {키: I2, 말: "오늘은 도장 정보를 고치고, 여러 도장을 오가거나 정리하는 방법이에요.", 속도: 0, 높낮이: 1}
아웃트로:
  - {키: O1, 말: "오늘 배운 세 단계, 기억하시죠? 도장 정보는 늘 최신으로 맞춰 두세요.", 속도: 1, 높낮이: 2}
  - {키: O2, 말: "다음 영상에서는, 내 정보를 바꾸는 방법을 알려 드릴게요. 태권 월드였습니다.", 속도: 0, 높낮이: 1}

장면:
  # ── 1단계: 도장 정보 고치기 ──
  - {키: P1, 단계: 1, 말: "첫 화면 안내 창은, 아래쪽 창 닫기 버튼으로 닫아 주세요.", 동작: 대기, 대상: 창 닫기}
  - {키: P2, 단계: 1, 말: "왼쪽 메뉴의 도장 관리에서, 도장을 눌러 주세요.", 동작: 대기, 대상: 도장}
  - {키: E1, 단계: 1, 말: "도장 이름과 전화번호, 주소를 여기서 바꿀 수 있어요.", 동작: 대기, 대상: 도장 이름}
  - {키: E2, 단계: 1, 말: "사업자 등록번호와 등록증은, 도장 정보와 꼭 같아야 해요.", 동작: 대기, 대상: 사업자 등록번호}
  - {키: E3, 단계: 1, 말: "도장 로고와 직인도 여기서 바꿀 수 있어요.", 동작: 대기, 대상: 도장 로고}
  - {키: E4, 단계: 1, 말: "다 고쳤으면, 오른쪽 위 저장을 누르면 돼요.", 동작: 대기, 대상: 저장}

  # ── 2단계: 다른 도장으로 바꾸기 ──
  - {키: C1, 단계: 2, 말: "도장이 여러 곳이라면, 왼쪽 위 점 세 개를 눌러 주세요.", 동작: 대기, 대상: 점 세 개}
  - {키: C2, 단계: 2, 말: "등록된 도장 보기를 누르면, 내 도장들이 카드로 나와요.", 동작: 대기, 대상: 등록된 도장 보기}
  - {키: C3, 단계: 2, 말: "옮겨 갈 도장의 관리하러 가기를 누르면, 그 도장 홈으로 가요.", 동작: 대기, 대상: 관리하러 가기}

  # ── 3단계: 도장 삭제하기 ──
  - {키: X1, 단계: 3, 말: "도장을 지우려면, 카드 오른쪽 위 점 세 개에서 삭제를 누르면 돼요.", 동작: 대기, 대상: 삭제}
  - {키: X2, 단계: 3, 말: "사범님이나 수련생이 남아 있으면 지울 수 없으니, 먼저 퇴사와 퇴소를 해 주세요.", 동작: 대기, 대상: 소속 수}
