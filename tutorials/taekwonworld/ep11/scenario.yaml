# 11편(파트 4 · 운영 시작 4/4) 청구서 조회·납부 관리. 공식 자료: intro_tkw_payment_2.pdf 2·3절, 납부관리 '가이드 라인' 창·그림(guide/payment/bill_manage_description_*).
# {ID} 는 실행할 때 TW_DEMO_ID 로 바뀜. 이 편만의 동작은 run_ep11.py.
# 결제서비스에 가입된 시험 도장 두 곳에서 찍는다(이름 흐림): 청구서 조회 = '경희대SJC 결제테스트'(청구서 1건), 납부관리 = '고려대 만덕태권도 결제테스트'(현장결제 기록).
# 안전: 납부 화면의 쓰기 요청은 모두 막는다(요청차단: /bill). 관리대장 생성·청구서 삭제는 가리키기만 한다.
# 길이 목표 2분 20초 안(RULES 2). 페이지 이동은 문장 사이에 두고, 로딩은 보내기 전에 잘라 낸다(RULES 5).
제목: 청구서 조회와 납부 관리, [3단계]면 끝!
파일이름: 태권월드_11편_납부관리
주소: https://taekwonworld.net/home
로그인주소: https://taekwonworld.net/account/login
브랜드: taekwonworld
시작상태: 로그인
단계이름: [청구서 조회하기, 납부 현황 보기, 현장 결제 적기]
다음편: "12편: 공지"
팝업닫기: false
개인정보칸:
  - input[name=username]
  - input[name=password]
요청차단: /bill

미리하기:
  - 동작: 입력
    칸:
      - {대상: "input[name=username]", 값: "{ID}"}
      - {대상: "input[name=password]", 값: "@보관함"}
    버튼: "button[type=submit]:has-text('로그인'), button:text-is('로그인')"

인트로:
  - {키: I1, 말: "안녕하세요, 태권 월드입니다.", 속도: 2, 높낮이: 3}
  - {키: I2, 말: "오늘은 파트 4의 마지막, 청구서 조회와 납부 관리 방법을 알려 드릴게요.", 속도: 0, 높낮이: 1}
아웃트로:
  - {키: O1, 말: "오늘 배운 세 단계, 기억하시죠? 이걸로 파트 4, 운영 시작이 끝났어요.", 속도: 1, 높낮이: 2}
  - {키: O2, 말: "다음 영상에서는, 학부모님께 공지를 올리는 방법을 알려 드릴게요. 태권 월드였습니다.", 속도: 0, 높낮이: 1}

장면:
  # ── 1단계: 청구서 조회하기 (경희대SJC 결제테스트) ──
  - {키: R1, 단계: 1, 말: "첫 화면 안내 창은, 아래쪽 창 닫기 버튼으로 닫아 주세요.", 동작: 대기, 대상: 창 닫기}
  - {키: R2, 단계: 1, 말: "왼쪽 메뉴의 납부에서, 청구서 조회를 눌러 주세요.", 동작: 대기, 대상: 청구서 조회}
  - {키: R3, 단계: 1, 말: "위쪽에서 보낸 청구서와 결제완료, 결제대기, 결제취소 건수를 한눈에 봐요.", 동작: 대기, 대상: 청구 현황}
  - {키: R4, 단계: 1, 말: "발행일 기준과 청구월 기준으로 바꿔 보고, 항목과 상태로 골라 볼 수도 있어요.", 동작: 대기, 대상: 조회 조건}
  - {키: R5, 단계: 1, 말: "목록에서 수련생마다 청구 금액과 결제 상태를 확인해요.", 동작: 대기, 대상: 청구서 목록}
  - {키: R6, 단계: 1, 말: "아직 결제 전인 청구서는, 청구서 삭제로 지울 수 있어요.", 동작: 대기, 대상: 청구서 삭제}

  # ── 2단계: 납부 현황 보기 (고려대 만덕태권도 결제테스트) ──
  - {키: G0, 단계: 2, 말: "이번에는 납부관리예요. 현장 결제를 적어 둔 도장 화면으로 볼게요.", 동작: 대기, 대상: 납부관리}
  - {키: G1, 단계: 2, 말: "위쪽에서 전체와 납부, 미납 금액을, 청구서와 현장 결제로 나눠 보여 줘요.", 동작: 대기, 대상: 납부 현황}
  - {키: G2, 단계: 2, 말: "관리대장 생성을 누르면, 다니는 수련생의 수련비 목록이 한 번에 만들어져요.", 동작: 대기, 대상: 관리대장 생성}
  - {키: G3, 단계: 2, 말: "목록에서 누가 냈는지, 납부와 미납으로 바로 보여요.", 동작: 대기, 대상: 납부상태}

  # ── 3단계: 현장 결제 적기 ──
  - {키: E1, 단계: 3, 말: "도장에서 직접 받은 수련비는, 줄 오른쪽의 편집을 눌러 적어요.", 동작: 대기, 대상: 편집}
  - {키: E2, 단계: 3, 말: "납부상태를 납부로 바꾸고, 납부일과 납부방법을 확인해 주세요.", 동작: 대기, 대상: 납부상태·납부방법}
  - {키: E3, 단계: 3, 말: "메모를 남기고 저장을 누르면 돼요.", 동작: 대기, 대상: 저장}
  - {키: E4, 단계: 3, 말: "납부 통계차트를 누르면, 납부율과 결제 방법별 매출을 그래프로 볼 수 있어요.", 동작: 대기, 대상: 납부 통계차트}
