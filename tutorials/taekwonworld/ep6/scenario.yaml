# 6편(파트 3 · 사람 모으기 2/3) 수련생 등록. 공식 가이드 '수련생 등록하기(신규·일괄)' + 일괄 등록 양식(엑셀).
# {ID} 는 실행할 때 TW_DEMO_ID 로 바뀜. 이 편만의 동작은 run_ep6.py. 엑셀 화면은 excel_mock.html(실제 양식을 본뜬 화면).
제목: 수련생 등록, [3단계]면 끝!
파일이름: 태권월드_6편_수련생등록
주소: https://taekwonworld.net/home
로그인주소: https://taekwonworld.net/account/login
브랜드: taekwonworld
시작상태: 로그인
단계이름: [수련생 등록 열기, 한 명씩 등록하기, 여러 명 한꺼번에 등록하기]
다음편: "7편: 수련생, 학부모 초대"
팝업닫기: false
개인정보칸:
  - input[name=username]
  - input[name=password]
요청차단: /manage/student   # 수련생 등록(쓰기)을 막음 — 실제로 수련생이 생기지 않음. 값은 모두 예시

미리하기:
  - 동작: 입력
    칸:
      - {대상: "input[name=username]", 값: "{ID}"}
      - {대상: "input[name=password]", 값: "@보관함"}
    버튼: "button[type=submit]:has-text('로그인'), button:text-is('로그인')"

인트로:
  - {키: I1, 말: "안녕하세요, 태권 월드입니다.", 속도: 2, 높낮이: 3}
  - {키: I2, 말: "오늘은 파트 3의 두 번째, 수련생을 등록하는 방법을 알려 드릴게요.", 속도: 0, 높낮이: 1}
아웃트로:
  - {키: O1, 말: "오늘 배운 세 단계, 기억하시죠? 등록한 뒤에도, 수련생 조회에서 언제든 고칠 수 있어요.", 속도: 1, 높낮이: 2}
  - {키: O2, 말: "다음 영상에서는, 수련생과 학부모를 초대해 볼게요. 태권 월드였습니다.", 속도: 0, 높낮이: 1}

