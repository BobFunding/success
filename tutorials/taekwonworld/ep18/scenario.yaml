# 18편(파트 7 · 도장 알리기) 도장 홈페이지. 공식 사용자 가이드에 항목 없음. 태권월드 '도장 홈페이지' 메뉴 화면(주소·ARS·QR·관리안내 3단계 그림)을 따라간다.
# 사용자 요청(2026-10-16): '왜 하려고 하는지' 맥락의 이야기로. 데모 도장 홈페이지는 지금 닫혀 있어 사이트는 열지 않고, 메뉴 화면의 관리안내 그림으로 설명한다.
# {ID} 는 실행할 때 TW_DEMO_ID 로 바뀜. 이 편만의 동작은 run_ep18.py. 왜 필요한지는 phone/why.html(안내 화면). 읽기만 한다(요청차단: /hp).
제목: 도장 홈페이지 쓰기, [3단계]면 끝!
파일이름: 태권월드_18편_도장홈페이지
주소: https://taekwonworld.net/home
로그인주소: https://taekwonworld.net/account/login
브랜드: taekwonworld
시작상태: 로그인
단계이름: [왜 필요할까요, 주소와 QR 확인하기, 홈페이지 관리하기]
다음편: "19편: 대시보드"
팝업닫기: false
개인정보칸:
  - input[name=username]
  - input[name=password]
요청차단: /hp

미리하기:
  - 동작: 입력
    칸:
      - {대상: "input[name=username]", 값: "{ID}"}
      - {대상: "input[name=password]", 값: "@보관함"}
    버튼: "button[type=submit]:has-text('로그인'), button:text-is('로그인')"

