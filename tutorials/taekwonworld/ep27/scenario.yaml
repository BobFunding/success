  - {키: N1, 단계: 1, 말: "왼쪽 메뉴 맨 아래, 서비스 문의를 눌러 주세요.", 동작: 대기, 대상: 서비스 문의}
  - {키: N2, 단계: 1, 말: "먼저 문의 유형을 골라요. 도장 관리, 결제, 계정 같은 종류가 있어요.", 동작: 대기, 대상: 문의 유형}
  - {키: N3, 단계: 1, 말: "궁금한 내용을 적고 오른쪽 위 등록을 누르면, 담당자가 확인하고 답변해 드려요.", 동작: 대기, 대상: 등록}

  # ── 2단계: 사용자 가이드 보기 ──
  - {키: G1, 단계: 2, 말: "그 바로 아래 사용자 가이드를 누르면, 기능별 설명서가 열려요.", 동작: 대기, 대상: 사용자 가이드}
  - {키: G2, 단계: 2, 말: "알고 싶은 기능을 누르면, 순서대로 설명이 나와요.", 동작: 대기, 대상: 기능 카드}
