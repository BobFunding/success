# 27편(파트 9 · 계정 도움말 2/3) 서비스 문의·사용자 가이드. 공식 가이드 '서비스 문의' + 왼쪽 메뉴 맨 아래 '사용자 가이드'(/guide, 새 창) + 기능 화면의 '사용 가이드'.
# {ID} 는 실행할 때 TW_DEMO_ID 로 바뀜. 이 편만의 동작은 run_ep27.py. 문의는 예시 문장만 적고 등록은 가리키기만 한다(요청차단: /service).
# 사용자 가이드는 원래 새 창으로 열리지만, 녹화 화면을 벗어나지 않게 같은 창에서 연다.
제목: 문의와 사용자 가이드, [3단계]면 끝!
파일이름: 태권월드_27편_서비스문의사용자가이드
주소: https://taekwonworld.net/home
로그인주소: https://taekwonworld.net/account/login
브랜드: taekwonworld
시작상태: 로그인
단계이름: [서비스 문의하기, 사용자 가이드 보기, 화면별 사용 가이드]
다음편: "28편: 로그아웃·회원 탈퇴"
팝업닫기: false
개인정보칸:
  - input[name=username]
  - input[name=password]
요청차단: /service

미리하기:
  - 동작: 입력
    칸:
      - {대상: "input[name=username]", 값: "{ID}"}
      - {대상: "input[name=password]", 값: "@보관함"}
    버튼: "button[type=submit]:has-text('로그인'), button:text-is('로그인')"

인트로:
  - {키: I1, 말: "안녕하세요, 태권 월드입니다.", 속도: 2, 높낮이: 3}
  - {키: I2, 말: "오늘은 궁금한 게 생겼을 때, 문의하고 사용자 가이드를 찾아보는 방법이에요.", 속도: 0, 높낮이: 1}
아웃트로:
  - {키: O1, 말: "오늘 배운 세 단계, 기억하시죠? 막힐 때는 가이드부터 열어 보세요.", 속도: 1, 높낮이: 2}
  - {키: O2, 말: "다음 영상에서는, 로그아웃과 회원 탈퇴 방법을 알려 드릴게요. 태권 월드였습니다.", 속도: 0, 높낮이: 1}

