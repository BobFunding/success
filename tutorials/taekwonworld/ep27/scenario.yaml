  - {키: Y1, 단계: 3, 말: "기능 화면을 처음 열면, 그 화면 사용 가이드가 먼저 나와요.", 동작: 대기, 대상: 전체 조회}
  - {키: Y2, 단계: 3, 말: "다 보셨으면, 아래쪽 닫기 버튼으로 닫아 주세요.", 동작: 대기, 대상: 닫기}
  - {키: Y3, 단계: 3, 말: "다시 보고 싶을 때는, 제목 옆 사용 가이드를 누르면 돼요.", 동작: 대기, 대상: 사용 가이드}
