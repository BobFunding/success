# 25편(파트 8 · 고치고 정리하기 7/7) 내 정보. 공식 가이드 '내 정보 설정하기' 페이지는 지금 '도장 변경 & 삭제' 내용이 잘못 들어가 있어(2026-10-16) 화면 순서대로:
# 왼쪽 위 ≡ → 프로필 '내 정보'(/mypage/account) → 기본 정보·저장 → 계정 정보(비밀번호·이메일·전화번호 변경) → 관장 정보 → 더보기(/mypage/resume) → 저장.
# {ID} 는 실행할 때 TW_DEMO_ID 로 바뀜. 이 편만의 동작은 run_ep25.py. 저장·변경은 모두 가리키기만, 비밀번호 변경 창은 열어 보고 Esc 로 닫는다(요청차단: /mypage).
# 이름·생년월일·아이디·이메일·전화번호·자격증 번호는 녹화할 때부터 흐린다. 탈퇴하기는 28편.
제목: 내 정보 관리, [3단계]면 끝!
파일이름: 태권월드_25편_내정보
주소: https://taekwonworld.net/home
로그인주소: https://taekwonworld.net/account/login
브랜드: taekwonworld
시작상태: 로그인
단계이름: [내 정보 열기, 기본·계정 정보 바꾸기, 관장 정보 채우기]
다음편: "26편: 아이디·비밀번호 찾기"
팝업닫기: false
개인정보칸:
  - input[name=username]
  - input[name=password]
  - input[name=last_name]
  - input[name=first_name]
요청차단: /mypage

미리하기:
  - 동작: 입력
    칸:
      - {대상: "input[name=username]", 값: "{ID}"}
      - {대상: "input[name=password]", 값: "@보관함"}
    버튼: "button[type=submit]:has-text('로그인'), button:text-is('로그인')"

인트로:
  - {키: I1, 말: "안녕하세요, 태권 월드입니다.", 속도: 2, 높낮이: 3}
  - {키: I2, 말: "오늘은 관장님 내 정보를 바꾸고, 자격증과 경력을 채우는 방법이에요.", 속도: 0, 높낮이: 1}
아웃트로:
  - {키: O1, 말: "오늘 배운 세 단계, 기억하시죠? 이걸로 파트 8, 고치고 정리하기가 끝났어요.", 속도: 1, 높낮이: 2}
  - {키: O2, 말: "다음 영상에서는, 아이디와 비밀번호를 잊었을 때 찾는 방법을 알려 드릴게요. 태권 월드였습니다.", 속도: 0, 높낮이: 1}

장면:
  # ── 1단계: 내 정보 열기 ──
  - {키: P1, 단계: 1, 말: "첫 화면 안내 창은, 아래쪽 창 닫기 버튼으로 닫아 주세요.", 동작: 대기, 대상: 창 닫기}
  - {키: P2, 단계: 1, 말: "왼쪽 맨 위, 줄 세 개 버튼을 누르면 내 프로필이 나와요.", 동작: 대기, 대상: 메뉴 버튼}
  - {키: P3, 단계: 1, 말: "여기서 내 정보를 눌러 주세요.", 동작: 대기, 대상: 내 정보}

  # ── 2단계: 기본·계정 정보 바꾸기 ──
  - {키: B1, 단계: 2, 말: "사진과 이름, 성별, 생년월일을 고치고 저장을 누르면 돼요.", 동작: 대기, 대상: 기본 정보}
  - {키: B2, 단계: 2, 말: "비밀번호와 이메일, 전화번호는 오른쪽 변경 버튼으로 바꿔요.", 동작: 대기, 대상: 계정 정보}
  - {키: B3, 단계: 2, 말: "비밀번호 변경을 누르면, 지금 비밀번호와 새 비밀번호를 넣는 창이 나와요.", 동작: 대기, 대상: 비밀번호 변경}

  # ── 3단계: 관장 정보 채우기 ──
  - {키: K1, 단계: 3, 말: "아래 관장 정보에는 단증과 자격증, 학력, 경력이 보여요.", 동작: 대기, 대상: 관장 정보}
  - {키: K2, 단계: 3, 말: "더보기를 누르면, 자격증과 경력, 수상 이력을 더 넣을 수 있어요.", 동작: 대기, 대상: 더보기}
  - {키: K3, 단계: 3, 말: "다 넣었으면, 오른쪽 위 저장을 누르면 돼요.", 동작: 대기, 대상: 저장}
