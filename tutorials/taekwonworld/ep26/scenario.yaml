# 26편(파트 9 · 계정 도움말 1/3) 아이디·비밀번호 찾기. 공식 가이드 '아이디 / 비밀번호 찾기' 순서.
# 로그아웃 상태로 시작: 첫 화면 '로그인(관장)' → 로그인 화면 '아이디 찾기'(/account/find/username) → '비밀번호 찾기'(/account/find/password).
# 휴대전화·아이디 칸에는 예시 값을 적고 흐린다. 인증요청·인증확인·저장은 누르지 않고 가리키기만 한다(요청차단: /account/find — 인증 문자 안 나감).
제목: 아이디·비밀번호 찾기, [3단계]면 끝!
파일이름: 태권월드_26편_아이디비밀번호찾기
주소: https://taekwonworld.net/
브랜드: taekwonworld
시작상태: 로그아웃
단계이름: [로그인 화면 열기, 아이디 찾기, 비밀번호 찾기]
다음편: "27편: 서비스 문의·사용자 가이드"
팝업닫기: false
개인정보칸:
  - input[name=username]
  - input[name=password]
  - input[name=phone_number]
  - input[name=number_by_user]
요청차단: /account/find

인트로:
  - {키: I1, 말: "안녕하세요, 태권 월드입니다.", 속도: 2, 높낮이: 3}
  - {키: I2, 말: "오늘은 아이디나 비밀번호가 생각나지 않을 때, 찾는 방법이에요.", 속도: 0, 높낮이: 1}
아웃트로:
  - {키: O1, 말: "오늘 배운 세 단계, 기억하시죠? 찾은 아이디와 새 비밀번호로 다시 로그인해 보세요.", 속도: 1, 높낮이: 2}
  - {키: O2, 말: "다음 영상에서는, 서비스 문의와 사용자 가이드를 쓰는 방법을 알려 드릴게요. 태권 월드였습니다.", 속도: 0, 높낮이: 1}

장면:
  # ── 1단계: 로그인 화면 열기 ──
  - {키: J1, 단계: 1, 말: "태권 월드 첫 화면 오른쪽 위에서, 로그인 관장 버튼을 눌러 주세요.", 속도: -1, 동작: 대기, 대상: 로그인(관장)}
  - {키: J2, 단계: 1, 말: "로그인 버튼 위쪽에, 아이디 찾기와 비밀번호 찾기가 있어요.", 동작: 대기, 대상: 아이디 찾기}

  # ── 2단계: 아이디 찾기 ──
  - {키: U1, 단계: 2, 말: "아이디 찾기를 누르고, 가입할 때 쓴 휴대전화 번호를 적어 주세요.", 동작: 대기, 대상: 휴대전화}
  - {키: U2, 단계: 2, 말: "인증요청을 누르면, 문자로 인증번호 네 자리가 와요.", 동작: 대기, 대상: 인증요청}
  - {키: U3, 단계: 2, 말: "인증번호를 적고 인증확인을 누르면, 내 아이디가 나와요.", 동작: 대기, 대상: 인증확인}
  - {키: U4, 단계: 2, 말: "문자가 안 오면 인증요청을 한 번 더 누르고, 그래도 안 되면 고객센터로 문의해 주세요.", 동작: 대기, 대상: 인증요청}

  # ── 3단계: 비밀번호 찾기 ──
  - {키: Z1, 단계: 3, 말: "비밀번호를 잊었다면, 로그인 화면에서 비밀번호 찾기를 눌러요.", 동작: 대기, 대상: 비밀번호 찾기}
  - {키: Z2, 단계: 3, 말: "아이디와 휴대전화를 적고, 인증번호를 받아 적어 주세요.", 동작: 대기, 대상: 아이디}
  - {키: Z3, 단계: 3, 말: "새 비밀번호는 숫자와 영문, 특수문자를 섞어 여덟 자리 이상으로 두 번 적어요.", 동작: 대기, 대상: 새 비밀번호}
  - {키: Z4, 단계: 3, 말: "마지막으로 저장을 누르면, 새 비밀번호로 로그인할 수 있어요.", 동작: 대기, 대상: 저장}
